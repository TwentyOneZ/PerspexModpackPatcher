Extended Zone Radius = 1

## Bias each peer's active-area center forward along their velocity vector so the
## server starts loading zones BEFORE the peer crosses the boundary. Composes with
## 'Extended Zone Radius' — the symmetric ring still expands, the center just slides
## forward. By the time the peer arrives, the predicted zones are already loaded.
## SERVER-ONLY — clients ignore this setting.
# Setting type: Boolean
# Default value: true
Enable Predictive Zone Streaming = true

## How many seconds ahead the server projects each peer's position when deciding
## which zones to pre-load. 3 s gives one zone of headroom at running speed.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0,5 to 10
Prediction Lookahead Sec = 3

## Minimum smoothed speed (m/s) below which prediction is suppressed and the peer's
## real position is used. Stops idle / slow-walking peers from triggering pre-load.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 20
Prediction Min Velocity = 2

## Hard cap on prediction distance, expressed in zones (64 m each). Stops a
## teleporting / glitching peer from subscribing to zones across the world.
# Setting type: Int32
# Default value: 9
# Acceptable value range: From 1 to 25
Prediction Max Lookahead Zones = 9

## Reduce update frequency for distant ZDOs (creatures/structures far away) to save bandwidth.
## SERVER-ONLY — no effect on client.
# Setting type: Boolean
# Default value: true
Enable ZDO Throttling = true

## Distance (meters) beyond which ZDOs are throttled (lower update rate).
## 0 = disable throttling.
## Recommended: 400-600m.
# Setting type: Single
# Default value: 500
# Acceptable value range: From 0 to 1000
ZDO Throttle Distance = 500

## Reduce FixedUpdate frequency for distant AI (saves server CPU).
## Nearby AI stays full speed for smooth combat.
## SERVER-ONLY — no effect on client.
# Setting type: Boolean
# Default value: true
Enable AI LOD Throttling = true

## Full-speed AI within this range (meters).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 50 to 200
AI LOD Near Distance = 100

## Beyond this distance, AI is throttled (meters).
# Setting type: Single
# Default value: 300
# Acceptable value range: From 200 to 600
AI LOD Far Distance = 300

## Update multiplier for throttled AI (0.5 = half speed, 0.25 = quarter). Lower = more savings.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,25 to 0,75
AI LOD Throttle Factor = 0.5

## Only engage FGN's send-side optimizations (distant-ZDO throttling, player
## boost, AI LOD) when a peer's send queue is actually backing up. On a server
## with bandwidth to spare, FGN leaves vanilla update order untouched — leaner
## and lower-latency. Turn OFF to force the optimizations on at all times.
## SERVER-ONLY.
# Setting type: Boolean
# Default value: true
Adaptive Throttling = true

## How full a peer's send queue must get (percent of cap) before Adaptive
## Throttling engages the optimizations. Lower = engages sooner.
## SERVER-ONLY.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 10 to 100
Congestion Threshold = 50

## Vanilla gives a creature to whichever nearby player the server checks first and keeps it there. With this on, a
## creature being fought moves to the player fighting it, otherwise to a nearby player with clearly lower ping, so its
## movement, attacks and the hits on it are worked out on the best-placed machine. The current owner's game hands the
## creature over itself, as vanilla does with a chest someone opens, so no update in flight can undo the move, and hits
## already on their way are passed on. Bosses, tames, ridden creatures and creatures mid-attack are never moved.
## Off while Server-Side Simulation owns creatures. DEDICATED SERVER; only players with FGN hand creatures over.
# Setting type: Boolean
# Default value: true
Balance Creature Ownership = true

## How much lower, in ms, a nearby player's ping must be before a creature nobody is fighting moves to them.
# Setting type: Int32
# Default value: 40
# Acceptable value range: From 10 to 300
Ownership Ping Margin = 40

[11 - Ship Fixes]

## Apply permanent autopilot + jitter fixes to ALL ships.
# Setting type: Boolean
# Default value: true
Enable Universal Ship Fixes = true

## Server authoritatively simulates ship physics.
## Disabled by default — enable manually if you want the server to drive ship physics.
## 
## This also gates whether Selective (V3) ZDO ownership claims ships. Ownership IS simulation:
## whoever owns a hull runs its Rigidbody, and vanilla only applies impact damage on the owner,
## so a server that owns an empty boat can collide it against its own streaming colliders and
## damage it on flat water. Left OFF, ships stay peer-owned and the sailing client simulates
## them exactly as in vanilla, while creatures still move to the server.
## NOTE: the BROAD (V2) ownership toggle ignores this and claims ships regardless.
# Setting type: Boolean
# Default value: false
Server-Side Ship Simulation = false

[12 - Advanced]

## Vanilla decides whether something has fallen out of the world by comparing it to the
## HEIGHTMAP, which cannot see build pieces. Digging moves the heightmap, so pits and mines
## are fine, but anything resting on a piece BELOW the heightmap is not: a tame penned on a
## cellar floor under a mound, or a gravestone in that cellar, reads as under the world and
## is teleported up to the dirt, through the floor that was holding it. With this on, that
## one check asks what is actually underneath first (see 'Dedi Fell-Out Rescue Layers' for
## the surfaces that count) and only falls back to the heightmap when nothing is there.
## Affects Character.UnderWorldCheck and TombStone.PositionCheck. Costs a single raycast,
## and only in the moment vanilla was about to teleport something.
# Setting type: Boolean
# Default value: true
Fix Ground Snap Through Floors = true

## Diagnostic: log each peer's send-queue health every 10s on a dedicated
## server. Useful when investigating lag, but writes ~1 line per player per
## 10s to the log. Leave OFF for normal play. SERVER-ONLY.
# Setting type: Boolean
# Default value: false
Log Send Queue Heartbeat = false

## OFF by default. When ON, logs every Harmony patch attached to the AI tick,
## instantiation, and zone-gate methods this mod cares about — useful when
## troubleshooting mod-conflict scenarios (another mod's transpiler stomping our
## prefix, etc.) or when bringing up a new feature.
## 
## The runtime [ServerStatus] rollup is the ongoing health indicator; this toggle
## is only useful when you suspect Harmony itself didn't attach something.
# Setting type: Boolean
# Default value: false
Enable Boot Patch Verification = false

## OFF by default. When ON, adds enriched [BigZdoDiag] log lines next to vanilla's
## existing 'Writing a lot of data; X items, is not optimal' warning so you can see
## which ZDO is bloating its extra-data buckets (uid, prefab name, world position,
## owner peer id, bucket type and count).
## 
## NOTE: the underlying warning is emitted by vanilla Valheim, not by this mod.
## This toggle only controls whether we ATTACH context to it. Turn this on when you
## see the vanilla warning and want to track down the offending entity; leave it off
## otherwise so the log stays quiet.
# Setting type: Boolean
# Default value: false
Enable Large ZDO Diagnostics = false

## On re-syncs, only send ZDO fields that changed since last send to each peer.
## Initial sync always sends full ZDO state. Re-syncs only send the diff.
## Significant bandwidth reduction for high-field ZDOs (creatures, players) where
## only 1-2 fields change per tick (e.g. health, position).
## SERVER-ONLY — no effect on client.
# Setting type: Boolean
# Default value: true
Enable ZDO Delta Compression = true

## Skips the wear and support update for building pieces whose damage modifiers are all
## Immune or Ignore (Infinity Hammer, admin-flagged pieces), on the server that owns them.
## Every other piece updates exactly as in vanilla.
## SERVER-ONLY — no effect on client.
# Setting type: Boolean
# Default value: true
Enable WearNTear Server Optimization = true

## CLIENT-side counterpart to the WearNTear server optimization. Short-circuits the
## expensive WearNTear.UpdateSupport call (Physics.OverlapBoxNonAlloc per piece) for
## pieces whose damage modifiers are all Immune/Ignore — e.g. Infinity Hammer pieces.
## Pins m_support at the material's max value so neighbouring mortal pieces still
## see full support when querying. Massive steady-state CPU saving in megabases
## dominated by invulnerable pieces.
# Setting type: Boolean
# Default value: true
Enable Invulnerable Support Skip = true

## SERVER-ONLY defensive cleanup. Before vanilla ZNetScene.RemoveObjects walks
## m_instances on the dedicated server, scan for entries whose ZNetView is
## Unity-destroyed OR whose view.GetZDO() returns null, and remove just the dict
## entry (the GameObject is left alone). These are exactly the entries that would
## NRE vanilla RemoveObjects, so we're only purging things vanilla can't handle.
## Triggered by mods that block WearNTear.RPC_Remove on the server while ZDOMan
## still reaps the ZDO via a separate path — e.g. TargetPortalProtection's
## Player.m_localPlayer-based permission check on a headless dedi when ZDO
## ownership has been moved to the server (FGN's Server-Side Simulation).
## 
## Every prune is logged at warning level (rate-limited to once per 5s) and the
## per-window count appears in the [ServerStatus] CDO segment. If you see this
## firing repeatedly on a healthy server, another mod is mismanaging ZNetScene
## state and should be investigated. Disable as a kill switch if it ever causes
## trouble (you'd then see the original NRE caught by the existing fallback).
# Setting type: Boolean
# Default value: true
Enable Instance Orphan Prune = true

## Fixes a Valheim 1.0 bug. When something jumps out of a player's area in one step
## (a portal, a teleport command), the server tests the position it is LEAVING, never tells
## that player, and they keep seeing the traveller frozen where they left until it next
## crosses a zone line. Re-runs vanilla's own check once the new position has landed.
## Stands down on its own when the game or another mod already fixes it, e.g.
## ValheimCommunityPatch's 'Fix Teleport Ghost Players' (deferred to while that is on).
## SERVER / LISTEN-HOST ONLY. No effect on a connecting client.
# Setting type: Boolean
# Default value: true
Fix Teleport Ghost Players = true

## Vanilla moves the sleep time skip forward by one physics step per rendered frame, so the
## skip meant to last 12 seconds takes longer the lower the server's frame rate. A busy server
## can keep everyone in bed for a minute or more. With this on, the skip follows real time and
## morning arrives after about 12 seconds however busy the server is.
## SERVER / LISTEN-HOST ONLY. No effect on a connecting client.
# Setting type: Boolean
# Default value: true
Fix Slow Sleep On Busy Servers = true

## Valheim disconnects a player whose keepalive goes unanswered for 30 seconds, and its keepalives
## wait behind everything already queued to send. A large transfer, such as a big base loading in,
## could time a player out while data was still arriving. With this on, keepalives go ahead of the
## queue. Works on whichever side has it; install on server and clients to cover both directions.
# Setting type: Boolean
# Default value: true
Keep Busy Connections Alive = true

## Every 2 seconds the server corrects each player's clock, and vanilla applies the correction at once.
## Waves are worked out from that clock, so every correction moves the water under a ship in a single
## physics step, and a boat with players aboard takes the jump as slamming into the water and loses hull
## health. The more a connection's timing wobbles, the bigger and more frequent the hits. With this on,
## waves follow a clock that eases each correction in over a few seconds, so the water never jumps.
## Corrections of 5 seconds or more (sleeping, reconnecting) still apply at once, as in vanilla.
## CLIENT-SIDE. A ship is damaged by the game of the player who owns it, normally someone aboard,
## so every player who sails needs this on. No effect on a dedicated server.
# Setting type: Boolean
# Default value: true
Fix Boat Damage From Server Time Sync = true

## Vanilla takes the item out of your inventory, then asks whoever your game thinks runs that smelter, kiln,
## fermenter, cooking station, fire, shield generator or ballista to add it. If that player has left, is out of
## range or has only just been handed the station, the request is ignored and the item is lost. With this on, the
## server delivers the request to the station's real owner once their game knows it owns it, and hands a station
## nobody is running to the player using it.
## DEDICATED SERVER ONLY. No client install needed.
# Setting type: Boolean
# Default value: true
Fix Lost Station Inserts = true

