## Hard cap on how long to wait for the local player to actually finish spawning into the
## world before forcing the probe to start anyway. The probe gates on Game.m_playerInitialSpawn
## (the same event that fires the '$text_player_arrived' chat message) so the probe doesn't
## start while the player is still mid-load — that event normally fires within tens of
## seconds of connect, but heavy modpacks with large worlds + slow disks can take 90s+.
## This timeout is the safety valve: if the spawn fails entirely we eventually proceed
## anyway rather than leave the client stuck at a degraded default tier forever. 180s
## covers worst-case modpack loads on slow disks; raise only if you have repro evidence
