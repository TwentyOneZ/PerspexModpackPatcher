Ping Count = 10

## If any single ping round-trip exceeds this, we hard-default to LOW tier and skip the
## bandwidth probe entirely — the client is already struggling, no point making them prove
## it twice.
# Setting type: Int32
# Default value: 2000
# Acceptable value range: From 500 to 5000
Ping Abort Ms = 2000

## Size of the bandwidth-test payload requested from server. Only runs if the latency probe
## puts the client at MED or HIGH tier — LOW-tier clients skip this entirely.
## 
## Larger payloads measure throughput more honestly: a request-response with a small
## payload is dominated by RTT, not actual link capacity. With a 64ms RTT, a 32KB payload
## ceilings at ~500 KB/s no matter what the link can deliver. 128KB at the same RTT can
## report up to ~2 MB/s — the transfer time finally dominates the RTT. Default raised
## from 32KB → 128KB on 2026-05-11 because the small-payload probe was systematically
## under-reporting on healthy links and incorrectly tier-downgrading.
## Tradeoff: probe takes ~1.5s longer per session and consumes ~256KB of extra one-time
## bandwidth on the dedicated server.
# Setting type: Int32
# Default value: 131072
# Acceptable value range: From 8192 to 524288
Bandwidth Probe Bytes = 131072

