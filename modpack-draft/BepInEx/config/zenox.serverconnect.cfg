## Settings file was created by plugin ServerConnect v1.0.9
## Plugin GUID: zenox.serverconnect

[ServerButton]

## If true, adds a button to the main menu that connects straight to the configured server with the configured password, skipping the server browser.
# Setting type: Boolean
# Default value: true
Enabled = true

## Text shown on the main menu button.
# Setting type: String
# Default value: My Server
Label = Perspex

## Server address (ip:port) the button connects to.
# Setting type: String
# Default value: 127.0.0.1:2456
Address = REPLACE_WITH_SERVER_ADDRESS

## Password submitted automatically when connecting via the button.
# Setting type: String
# Default value: changeme
Password = REPLACE_BEFORE_USE

