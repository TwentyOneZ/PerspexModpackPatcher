[2 - Moon]

## Astronomical: the Moon is placed by the orbital model, so it rises and sets at the hours its phase implies, shows up in daylight near the quarters and is missing from part of some nights. It is a model, not an ephemeris: one observer for the whole world and no seasons. Vanilla: it stays opposite the Sun, rising at sunset every night as in the base game, with only the phase and eclipses changing.
# Setting type: MoonPathMode
# Default value: Astronomical
# Acceptable values: Astronomical, Vanilla
MoonPath = Astronomical

## Realistic: the lunar maps shipped with the mod, baked from real colour and elevation surveys of the Moon, so the seas and craters are where they belong. Procedural: a surface the mod draws itself. Falls back to procedural when the map files are missing.
# Setting type: MoonSurfaceMode
# Default value: Realistic
# Acceptable values: Procedural, Realistic
MoonSurface = Realistic

## Strength of the relief on the realistic Moon surface. It only shows near the terminator, where the Sun grazes the craters. 0 turns it off; above 1 it looks noisy.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 4
MoonSurfaceRelief = 0.5

## Size of the Moon's disc relative to the vanilla one. Eclipse geometry scales with it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 2
SizeScale = 1

## Brightness of the Moon. At 1 a full moon at mean distance is as bright as the vanilla moon.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 2
Brightness = 1

[3 - Eclipses]

## Solar and lunar eclipses, decided by geometry alone: new or full moon, near a node, with the apparent sizes and the Moon's distance saying whether an eclipse is partial, total or annular. Nothing is random.
# Setting type: Boolean
# Default value: true
Enabled = true

## Seconds of near-maximum effect in a solar eclipse. Valheim's accelerated day makes raw totality last only a few seconds. The default keeps the rendered Moon, corona and landscape dimming together for about 15 seconds, without changing the world clock or the eclipse calendar. 0 keeps the raw timing.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 60
SolarTotalityDuration = 15

## Dims light, sky and fog during a solar eclipse, in proportion to how much of the Sun is covered.
# Setting type: Boolean
# Default value: true
SolarEclipseLighting = true

## Shows the solar corona around the Moon during totality.
# Setting type: Boolean
# Default value: true
SolarCorona = true

[4 - Moonlight]

## Makes the night light, the glint on the water and the night fog follow the Moon's phase, height and eclipses. Vanilla has no moonlight of its own: it flips the Sun's light at night and keeps it equally bright every night. Stealth still reads the vanilla values, so this stays purely visual.
# Setting type: Boolean
# Default value: true
Enabled = true

## Night shadows and the glint on the water come from where the Moon is. With no Moon up, the light comes from overhead, like skyglow, and leaves no glint.
# Setting type: Boolean
# Default value: true
ShadowsFollowTheMoon = true

## How bright a moonless night is, as a fraction of a vanilla night (which is as bright as a full moon). Lower means darker new-moon nights.
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0 to 1
NightBrightnessWithoutMoon = 0.55

## Ambient light on a moonless night, as a fraction of the vanilla one.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
NightAmbientWithoutMoon = 0.8

## Glow of the night fog with no Moon, as a fraction of the vanilla one.
# Setting type: Single
# Default value: 0.85
# Acceptable value range: From 0 to 1
NightFogWithoutMoon = 0.85

[5 - Advanced]

## Length of a synodic month in world days. The sidereal, draconic and anomalistic months scale with it, so the real ratios between them survive and eclipse seasons keep working. A shorter month makes everything, eclipses included, come round faster.
# Setting type: Single
# Default value: 29.53059
# Acceptable value range: From 8 to 120
CycleLengthDays = 29.53059

## Where world day 0 sits on the real lunar calendar, counted in days from the mean new moon of 6 January 2000. The default makes the first night of day 1 almost exactly full Moon and puts the first visible total solar eclipse near noon on day 76. Only the starting date changes; periods and eclipse geometry stay the same.
# Setting type: Double
# Default value: 5829.9055
EpochOffsetDays = 5829.9055

## Tilt of the Moon's orbit. 5.145 is the real value. Lower values make eclipses more frequent, which is a gameplay choice rather than an astronomical one.
# Setting type: Single
# Default value: 5.145
# Acceptable value range: From 0,5 to 10
OrbitalInclinationDeg = 5.145

## Kepler's orbit: the Moon runs faster near perigee, which shifts the phases slightly.
# Setting type: Boolean
# Default value: true
EllipticalOrbit = true

## Apparent size changes with distance: bigger at perigee, smaller at apogee, which is what decides between a total and an annular eclipse.
# Setting type: Boolean
# Default value: true
DistanceVariation = true

## Lunar latitude from the orbital tilt and the draconic month. This is what creates eclipse seasons; without it eclipses would happen every month.
# Setting type: Boolean
# Default value: true
OrbitalInclination = true

## The Moon's wobble: over a month it shows up to about 7 degrees past its mean edge, and the maria drift towards and away from the limb.
# Setting type: Boolean
# Default value: true
Libration = true

## Earthshine, strong on a thin crescent and nearly gone near full moon.
# Setting type: Boolean
# Default value: true
EarthshineVariation = true

## Makes the Moon dimmer and more orange near the horizon, from atmospheric extinction. This is not an eclipse.
# Setting type: Boolean
# Default value: true
AtmosphericTint = true

## Perceptual compression of the moonlight. 1 is photometric, where a quarter moon gives about 9% of a full moon; 0.5 gives about 30%.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,2 to 1
MoonlightGamma = 1

## Radius of the Sun's disc used for eclipses, relative to the size that matches the game's Moon. The vanilla Sun is a glow without a defined edge, so this may need a nudge.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2
SolarDiscScale = 1

## Rotates the Moon surface map in longitude, in case a replacement map is not centred on the near side.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -180 to 180
MoonSurfaceLongitudeOffset = 0

## Width of the line between the lit and dark sides.
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0,001 to 0,25
TerminatorSoftness = 0.06

## Brightness of the earthshine on the dark side.
# Setting type: Single
# Default value: 0.03
# Acceptable value range: From 0 to 0,2
EarthshineBrightness = 0.03

## Brightness of the Moon inside the umbra during a total lunar eclipse. Around 1 matches a typical Danjon 2 to 3 eclipse.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,2 to 3
BloodMoonBrightness = 1

## How solid the Moon looks in a bright sky, where the blue of the day sits in front of it.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0,2 to 1
DaytimeOpacity = 0.8

## How much of the vanilla moon's blue to keep. 0 is the neutral, slightly warm grey of the real Moon.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
BlueTint = 0

## Resolution of the Moon's generated textures.
# Setting type: Int32
# Default value: 256
# Acceptable values: 128, 192, 256, 512
TextureSize = 256

