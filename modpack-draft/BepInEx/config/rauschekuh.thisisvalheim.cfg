[Effects]

## The game's own effect prefabs that go off at the door, by name, separated by commas. Drop one to lose that layer, or put fx_GP_Activation in for the sound a Forsaken power makes when you call on it. An empty list makes the kick silent.
# Setting type: String
# Default value: sfx_battering_ram_impact,sfx_wood_break,vfx_SawDust,fx_hit_camshake
Prefabs = sfx_battering_ram_impact,sfx_wood_break,vfx_SawDust,fx_hit_camshake

[Kick]

## How many times faster than normal a kicked door swings open.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 1 to 10
SwingSpeed = 4

## Whether a door that wants a key can be kicked open without it. Off keeps the crypts shut until you have found the key, the way the game intends - carry the key and the kick opens the door with it.
# Setting type: Boolean
# Default value: false
LockedDoors = false

## Whether a door you could kick open says so when you look at it.
# Setting type: Boolean
# Default value: true
ShowHint = true

