## Settings file was created by plugin Unified Target Portal v1.0.0
## Plugin GUID: com.xman0922.unifiedtargetportal

[Portals]

## Choose a destination on the map when using a portal. Hold Use to rename instead.
# Setting type: Boolean
# Default value: true
Enabled = true

## Seconds between server checks for portal changes.
# Setting type: Single
# Default value: 5
BroadcastInterval = 5

## List portals that have no tag.
# Setting type: Boolean
# Default value: true
ShowUntagged = true

## Allow portal owners to switch between Public and Private with Shift + Use.
# Setting type: Boolean
# Default value: true
AllowPrivatePortals = true

## Modifier held while using a portal to switch its visibility mode.
# Setting type: KeyboardShortcut
# Default value: LeftShift
ModeToggleShortcut = LeftShift

## Show or hide portal pins while the large map is open. F8 avoids Valheim 1.0's P-to-ping binding.
# Setting type: KeyboardShortcut
# Default value: F8
MapPinsShortcut = F8

## Walk into a portal to open the destination map, like TargetPortal. Off: press Use to open it instead.
# Setting type: Boolean
# Default value: true
OpenMapOnEnter = true

## Show the active portal swirl on every portal, since any portal can now reach any other.
# Setting type: Boolean
# Default value: true
PortalAnimation = true

## Hide other map pins while choosing a destination, so only portals are visible.
# Setting type: Boolean
# Default value: true
HidePinsDuringPortal = true

## Keep live player pins visible while choosing a destination, matching TargetPortal.
# Setting type: Boolean
# Default value: true
ShowPlayerPinsDuringPortal = true

## Allow the portal-pin hotkey while the small map is active, matching TargetPortal's optional setting.
# Setting type: Boolean
# Default value: false
AllowMapPinToggleWhenClosed = false

## Maximum portal-name length.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 5 to 100
PortalNameLength = 10

## Maximum portals allowed in the world. 0 means unlimited.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 10000
MaximumNumberOfPortals = 0

## Never: enforce restrictions for every portal. Default: use the portal's vanilla rule. Always: ignore restrictions.
# Setting type: ItemRestrictionMode
# Default value: Default
# Acceptable values: Never, Default, Always
IgnoreItemTeleportRestrictions = Default

## Visibility mode assigned to newly built portals.
# Setting type: PortalMode
# Default value: Private
# Acceptable values: Public, Private
DefaultPortalMode = Private

