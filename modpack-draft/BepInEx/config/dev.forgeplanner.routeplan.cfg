Modifier = LeftControl

## Name given to a pin you place with the modifier held. Empty follows the mod's language; anything else is used as given.
# Setting type: String
# Default value: 
MarkName = 

[Route]

## How close you have to get for a stop to count as reached, in metres.
# Setting type: Single
# Default value: 2
ArriveRadius = 2

## Tick the map pin off when you reach it, the same tick the game uses.
# Setting type: Boolean
# Default value: true
TickOffOnArrival = true

## After dying, put the grave at the head of the route and steer there. The rest of the route is kept - the errand is still there, it just has a detour in front of it.
# Setting type: Boolean
# Default value: true
DeathFirst = true

## Name of the pin the mod puts on your grave, when the game has not already put one there itself. Empty follows the mod's language; anything else is used as given, in either language.
# Setting type: String
# Default value: 
DeathPinName = 

## After the last stop, start over from the first one.
# Setting type: Boolean
# Default value: false
Loop = false

## Play a sound on reaching a stop. Off by default: a noise on arriving somewhere you were already walking to interrupts more often than it informs.
# Setting type: Boolean
# Default value: false
PlayArrivalSound = false

## Name of the game's sound prefab to play on reaching a stop. The mod borrows the clip out of it and plays that, so nothing is spawned into the world. Leave it empty for silence.
# Setting type: String
# Default value: sfx_lootspawn
ArrivalSound = sfx_lootspawn

## How loud that sound is, on top of the game's own effects volume.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0 to 1
ArrivalVolume = 0.2

