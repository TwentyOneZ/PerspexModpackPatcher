## Settings file was created by plugin RoutePlanner v1.0.1
## Plugin GUID: dev.forgeplanner.routeplan

[Colors]

## Colour of the arrow, six hex digits. The dark outline is derived from it and is not configurable: its whole job is to stay darker than the fill so the arrow reads on snow and at night.
# Setting type: String
# Default value: E7CCAF
ArrowColor = E7CCAF

## Colour of the target name, six hex digits.
# Setting type: String
# Default value: E7CCAF
NameColor = E7CCAF

## Colour of the distance line and the coordinates, six hex digits.
# Setting type: String
# Default value: C9963F
DistanceColor = C9963F

[General]

## Skip to the next stop of the route without walking there.
# Setting type: KeyboardShortcut
# Default value: PageDown
Next = PageDown

## Go back to the previous stop.
# Setting type: KeyboardShortcut
# Default value: PageUp
Previous = PageUp

## Show or hide the on-screen arrow block. Coordinates, the map itself and the settings window are not affected.
# Setting type: KeyboardShortcut
# Default value: F8
ToggleHud = F8

## Show or hide the list of stops. Not the same key as ToggleHud - that one shows and hides the arrow. If F9 already does something on your setup - it can touch the gamepad button preset - put any other key here.
# Setting type: KeyboardShortcut
# Default value: F9
ToggleRoute = F9

## Show the mod in Russian instead of English. The same switch sits on the flag button in the settings window. Pin names the game itself supplies are not affected - those follow the language the game is running in.
# Setting type: Boolean
# Default value: false
Russian = false

## Write the name of every sound the loaded game has to the log, once, so one can be chosen for ArrivalSound. The names are not documented anywhere else.
# Setting type: Boolean
# Default value: false
ListSounds = false

[HUD]

## Route window position across the screen, 0 is the left edge.
# Setting type: Single
# Default value: 0.82
RouteX = 0.82

## Route window position down the screen, 0 is the top.
# Setting type: Single
# Default value: 0.3
RouteY = 0.3

## Draw the target pin's own icon beside the arrow.
# Setting type: Boolean
# Default value: true
PinIcon = true

## Show the arrow on screen.
# Setting type: Boolean
# Default value: true
Enabled = true

## Arrow position across the screen, 0 is the left edge and 1 the right.
# Setting type: Single
# Default value: 0.5
X = 0.5

## Arrow position down the screen, 0 is the top and 1 the bottom.
# Setting type: Single
# Default value: 0.12
Y = 0.12

## Size of the arrow alone, inside the block.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3333333 to 3
ArrowScale = 1

## Size of the target name and the distance line.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3333333 to 3
TextScale = 1

## Size of the settings window. The strip under the map keeps a fixed size, so enlarging the window to read it does not shove the coordinates around.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,5 to 2,5
UiScale = 1

## Size of the whole on-screen block, arrow and text together. The two scales above are relative to it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3333333 to 3
CursorScale = 1

## How solid the on-screen block is, arrow and captions together. One is opaque.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,15 to 1
Opacity = 1

## Show your coordinates under the map while it is open.
# Setting type: Boolean
# Default value: true
Coordinates = true

## Draw a dark box behind the text. Off by default: the text carries its own outline, and the box read as a foreign element on screen.
# Setting type: Boolean
# Default value: false
Background = false

[Map]

