## Settings file was created by plugin OdinOnDemand v1.3.0
## Plugin GUID: com.valmedia.odinondemand

[Client Side]

## The default volume a mediaplayer's volume slider is at when first loaded into the world.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Audio Default Volume = 1

## This will make the screen unaffected by world light and look better. On by default. Only applied on newly placed screens.
# Setting type: Boolean
# Default value: true
Video Screen Backlight = true

## When enabled, cart players and skalds girdle will have a visual representation of audio playing as sound waves. 
# Setting type: Boolean
# Default value: true
Mobile Player Visuals = true

## Enable Extra Debug Logging
# Setting type: Boolean
# Default value: false
Debug Logging = false

## When a player is outside the audio range of a screen, the screen will stop rendering. 
# Setting type: Boolean
# Default value: false
Screens Stop Rendering Out of Range = false

## How the in-game music fades in and out. Fade: Gradually changes volume based off distance from nearest active mediaplayer. None: No change.
# Setting type: FadeType
# Default value: Fade
# Acceptable values: Fade, None
Music Fade Type = Fade

## The lowest volume the music will fade to in DB. -65-80 is completely silent, 0 is neutral volume.
# Setting type: Single
# Default value: -60
# Acceptable value range: From -80 to 0
Lowest Fade Volume DB = -60

[Mixer Volumes]

## Master volume of all Screens. Clientside setting.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -15 to 15
Screen Master Volume = 1

## Master volume of all Radios. Clientside setting.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -15 to 15
Radio Master Volume = 1

## Master volume of all players roaming using Skald's Girdle or Bard's Wagon. Clientside setting.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -15 to 15
Mobile Player Master Volume = 1

[Recipes]

## If enabled, plugin will attempt to ammend new recipes to old recipe files. An old recipe file is one that is detected lacking certain piece names. If you would like to completely remove certain recipes via JSON, disable this.
# Setting type: Boolean
# Default value: true
Auto-Update Recipe File = true

[Remote Control]

## How far away you can control mediaplayers with the remote control.
# Setting type: Single
# Default value: 25
Remote Control Distance = 25

## If enabled, only the creator of the mediaplayer may control it with a remote control.
# Setting type: Boolean
# Default value: false
Remote Control Owner Only = false

[Server]

## Default listening distance for all mediaplayers.
# Setting type: Single
# Default value: 75
Audio Default Distance = 75

## The maximum a viking can set a mediaplayer's listening distance to. Admins ignore this.
# Setting type: Single
# Default value: 250
Maximum Listening Distance = 250

## The listening distance of Mobile Players. Admins can still change their distance in the cog-wheel menu.
# Setting type: Single
# Default value: 30
Mobile Player Listening Distance = 30

## The time in seconds between each send net-sync of the mediaplayer's current time. Lower values are more taxing on the server.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0,001 to 3,402823E+38
Sync Time = 30

## Whether or not Skald's Girdle is sold at the trader.
# Setting type: Boolean
# Default value: true
Skalds Girdle Sold at Haldor = true

## The cost of Skald's Girdle at the trader.
# Setting type: Int32
# Default value: 1000
Skalds Girdle Cost = 1000

[VIP Mode]

## When enabled, Only VIPs can place, remove, and interact with OdinOnDemand Pieces (admins excluded) WARNING: BETA. Use at own discretion. Please report any issues on Github/Nexus.
# Setting type: Boolean
# Default value: false
VIP Mode = false

## SteamID List Seperated by commas
# Setting type: String
# Default value: ,
VIP List = ,

## The message displayed when a non-VIP attempts to access a VIP-only piece.
# Setting type: String
# Default value: You are not allowed to perform this action.
VIP Message = You are not allowed to perform this action.

[Waveform Visualizer]

## The base scale factor of the audio visualizer. Higher values make the visualizer more sensitive to audio.
# Setting type: Single
# Default value: 6.5
# Acceptable value range: From 0,01 to 100
Base Scale Factor = 6.5

## The scale factor of the mid-range frequencies of the audio visualizer. 
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0,01 to 100
Mid Scale Factor = 3

## The scale factor of the high-range frequencies of the audio visualizer. 
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0,01 to 100
High Scale Factor = 4

[YouTube]

## Whether to use built-in library or self-hosted NodeJS yt-dlp server to grab YouTube URLs. You probably do not need to touch this setting, but see GitHub for setup if interested. Restart required. Extra options will appear after Node is selected.
# Setting type: YouTubeAPI
# Default value: YouTubeExplode
# Acceptable values: YouTubeExplode, NodeJs
YouTube API Type = YouTubeExplode

## Pass --update-to nightly to the local yt-dlp on the next YouTube playback. Client-side setting. Disabling stops requesting nightly updates; it does not downgrade yt-dlp.
# Setting type: Boolean
# Default value: false
Use Nightly yt-dlp = false

## Tallest YouTube or Twitch video stream to request. Decoding is done in software and every frame is uploaded from the CPU, so 1440p and 2160p cost several times more than 1080p and can stall the game. Client-side; applies on the next load or reload.
# Setting type: Int32
# Default value: 1080
# Acceptable values: 360, 480, 720, 1080, 1440, 2160
Max Video Height = 1080

## How far ahead VLC buffers network streams (YouTube audio, SoundCloud, radio, Twitch). Raise it if audio drops out on a slow or unstable connection; playback takes that much longer to start. Client-side; applies on the next load or reload.
# Setting type: Int32
# Default value: 1500
# Acceptable value range: From 300 to 10000
Stream Buffer Milliseconds = 1500

## Log cumulative VLC-to-Unity audio counters every five seconds and on end/stop. Client-side, default off; configure before launching. Counters restart when enabled. Logs contain no stream URLs and do not require Debug Logging.
# Setting type: Boolean
# Default value: false
Decoder Audio Stats = false

## Enable Youtube Functionality. Enabled by default.
# Setting type: Boolean
# Default value: true
Enable Youtube = true

