### Misc. balance related settings ###

# The main reason for having this feature at all is so you can still turn on Rune of Frozen Footfalls if you've fallen in the water.
RuneFocusEquippableInWater=true

RepairRune_HealRate=1
RepairRune_EffectRadius=10
ExtinguishingRune_EffectRadius=20  # Max is 31

# For comparison, a Rune Focus can hold 100 energy per level (400 at max)
runestoneMaxStoredEnergy=100
runestoneSecondsToFullCharge=5400
runestoneUnlockNewRuneChance=0.4

# If set to true, all enabled runes will be available immediately rather than unlocking via new Runestones
allRunesStartUnlocked=false


### Rune Enable/Disable Settings ###
# Set these to false to disable specific runes.  When disabled, they won't show up in the Rune Focus table, and the runes that can be placed in the world will disappear from newly loaded map chunks.

enableRune_runemagic_passive_WaterWalking=true    # Rune of Frozen Footfalls
enableRune_runemagic_passive_BoatPropulsion=true  # Rune of Ocean Currents
enableRune_runemagic_passive_Decumberance=true
enableRune_runemagic_passive_Alertness=true

enableRune_runemagic_LevelTerrain=true
enableRune_runemagic_RestoreTerrain=true
enableRune_runemagic_ShatteringRune=true
enableRune_runemagic_BlastingRune=true

enableRune_runemagic_DryLandRune=true
enableRune_runemagic_CalmWatersRune=true
enableRune_runemagic_CanopyRune=true
enableRune_runemagic_RepairRune=true
enableRune_runemagic_ChimneyRune=true
enableRune_runemagic_ExtinguishingRune=true

enableRune_runemagic_stone_waystone=true
enableRune_runemagic_stone_menhir=true
enableRune_runemagic_stone_boulder=true
enableRune_runemagic_stone_capstone=true
enableRune_runemagic_stone_monolith=true
enableRune_runemagic_stone_slab=true
enableRune_runemagic_stone_tor=true
enableRune_runemagic_stone_batholith=true
enableRune_runemagic_stone_arete=true
enableRune_runemagic_stone_megalith=true
enableRune_runemagic_stone_arch=true


### Rune Energy Cost Settings ###
# These determine the cost for using the various effects.  For passive effects, this is the cost/second while active, and for resizable
# terrain effects (e.g. Restoration Rune) this is the cost per unit of radius.

energyCost_runemagic_passive_WaterWalking=1
energyCost_runemagic_passive_WaterWalking-hotWaterCostMultiplier=3  # Increases the cost as the player gets closer to the Ashlands
energyCost_runemagic_passive_WaterWalking-lavaCostMultiplier=10     # Cost multiplier when using Rune of Frozen Footsteps to walk on lava
energyCost_runemagic_passive_BoatPropulsion=0.1
energyCost_runemagic_passive_Alertness=1
# This is the cost per second, per additional unit of weight carried above what would otherwise be the max
energyCost_runemagic_passive_Decumberance=0.0333

energyCost_runemagic_LevelTerrain=1
energyCost_runemagic_RestoreTerrain=0.5
energyCost_runemagic_ShatteringRune=10
energyCost_runemagic_BlastingRune=25

