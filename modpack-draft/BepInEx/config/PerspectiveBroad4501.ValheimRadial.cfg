[3 - Inventory Radial]

## Which inventory row to start from when building the Inventory Row radial.
## 0 = top row (default hotbar), 1 = second row, 2 = third row, etc.
## Values outside the inventory height will be clamped.
# Setting type: Int32
# Default value: 0
Start Row Index = 0

## How many inventory rows to include in the radial, starting at Start Row Index.
## For example: Start=0, Count=1 -> vanilla hotbar row only.
## Start=1, Count=1 -> second row only.
## Start=0, Count=3 -> top three rows.
## If the chosen range exceeds the inventory height, it will be clamped.
# Setting type: Int32
# Default value: 1
Row Count = 4

## If true, empty inventory slots within the selected rows appear as empty segments in the radial.
## If false, only actual items are added and the radial will have fewer segments.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Include Empty Slots = Off

## Controls which items from the selected rows are eligible to appear in the radial:
## - AllItems: no type filtering, every item can appear.
## - WeaponsAndTools: only weapons and tool-type items.
## - WeaponsToolsShields: weapons, tools, and shields.
## - ArmorAndUtility: armor, utility, trinkets.
## - ConsumablesOnly: food, potions, and other consumables.
## - CustomNameWhitelist: only items whose internal name matches the Custom Name Filter list.
# Setting type: InventoryRowFilterMode
# Default value: AllItems
# Acceptable values: AllItems, WeaponsAndTools, WeaponsToolsShields, ArmorAndUtility, ConsumablesOnly, CustomNameWhitelist
Filter Mode = ConsumablesOnly

## When enabled, only items that are currently equipped (m_equipped == true) will appear in the radial.
## This is applied after the type-based Filter Mode.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Equipped Only = Off

## Used when Filter Mode = CustomNameWhitelist.
## Comma-separated list of item identifiers. Each entry may be either:
## - The internal/shared name (m_shared.m_name), e.g. "$item_sword_iron"
## - The prefab name (m_dropPrefab.name), e.g. "SwordIron"
## Example:
## "$item_sword_iron,$item_axe_blackmetal,BowFineWood,ShieldBanded".
## Whitespace around entries is ignored. Case-insensitive comparison.
# Setting type: String
# Default value: 
Custom Name Filter = Lesser_Spiritual_Healing_Vial, Medium_Spiritual_Healing_Flask

