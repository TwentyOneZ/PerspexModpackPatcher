[1 - General]

## How the radial behaves for keyboard and controller:
## 
## Toggle  - Press an open key (or gamepad radial button) once to open, press it again to close.
##           The Close Radial key and Escape also close the wheel.
## 
## Hold    - Keep an open key (or gamepad radial button) held to keep the radial open.
##           Releasing all open keys closes the wheel. Close Radial / Escape still close instantly.
# Setting type: RadialActivationMode
# Default value: Hold
# Acceptable values: Toggle, Hold
Activation Mode = Hold

