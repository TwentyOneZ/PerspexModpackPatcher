## Settings file was created by plugin CartBuddy v0.9.3
## Plugin GUID: Pix.CartBuddy

[Assist]

## FreeRun, Attach, or Tether (experimental).
# Setting type: String
# Default value: Tether
HelperMode = FreeRun

## Hold-toggle range from cart center.
# Setting type: Single
# Default value: 2.6
HelperHoldRange = 2.6

## Cooldown between hold-toggle attempts.
# Setting type: Single
# Default value: 0.75
HoldCooldownSeconds = 0.75

## Helper counts within this radius of helper point.
# Setting type: Single
# Default value: 1.1
HelperPointRadius = 1.1

## Maximum helpers at once.
# Setting type: Int32
# Default value: 1
MaxHelpers = 1

[Boosts]

## Extra acceleration applied to cart when helpers active.
# Setting type: Single
# Default value: 15
AssistAcceleration = 15

## Stop adding assist if cart speed exceeds (puller speed + this).
# Setting type: Single
# Default value: 2.75
AssistMaxSpeedAdd = 2.75

## Only apply assist when puller speed >= this.
# Setting type: Single
# Default value: 0.85
AssistMinPullerSpeed = 0.85

## Opposing acceleration applied when puller stops.
# Setting type: Single
# Default value: 7
CoastBrake = 7

## Only apply coast brake up to this cart speed.
# Setting type: Single
# Default value: 5
CoastBrakeMaxSpeed = 5

## Viscous damping applied to cart velocity while helpers active (adds resistance).
# Setting type: Single
# Default value: 2.75
HelperDamping = 2.75

## Clamp for damping effect.
# Setting type: Single
# Default value: 10
HelperDampingMaxSpeed = 10

## Reduce load-based mass contribution by this fraction while helpers active.
# Setting type: Single
# Default value: 0.2
WeightReduction = 0.2

[Debug]

## Allow toggling helping while you are attached/pulling (solo testing).
# Setting type: Boolean
# Default value: false
AllowHelpingWhileAttached = false

## Show rope even when cart is not being pulled (cosmetic preview).
# Setting type: Boolean
# Default value: false
ShowRopeEvenIfNotPulled = false

[General]

## Enable CartBuddy.
# Setting type: Boolean
# Default value: true
Enabled = true

[HelperAttachPoint]

## Helper point local Z (behind).
# Setting type: Single
# Default value: -1.35
LocalBack = -1.35

## Helper point local Y (up).
# Setting type: Single
# Default value: 0.15
LocalUp = 0.15

## Helper point local X (side).
# Setting type: Single
# Default value: 0
LocalSide = 0

[Tether]

## Allowed drift before the tether starts pulling you back.
# Setting type: Single
# Default value: 1.6
Slack = 1.6

## Max pull speed toward the tether point.
# Setting type: Single
# Default value: 9
PullMaxSpeed = 10

## Legacy: max position correction per frame (stability).
# Setting type: Single
# Default value: 0.16
MaxStepPerFrame = 0.45

## Max position correction per second (stutter-proof).
# Setting type: Single
# Default value: 14
MaxStepPerSecond = 14

## Extra pull strength when stretched (0 = no scaling).
# Setting type: Single
# Default value: 2.25
TightenFactor = 2.25

## How much cart motion drags you along when behind.
# Setting type: Single
# Default value: 0.65
FollowVelocityFactor = 0.65

## Clamp for cart drag-along velocity.
# Setting type: Single
# Default value: 4.5
FollowVelocityMax = 4.5

## Rear rope point extra Z offset (further back).
# Setting type: Single
# Default value: -0.55
RearBackOffset = -0.55

## Rear rope half-width (kept for future).
# Setting type: Single
# Default value: 0.35
RearSideOffset = 0.35

## Rear rope height.
# Setting type: Single
# Default value: 0.75
RearUpOffset = 0.75

## How much the rope sags downward at the midpoint (visual).
# Setting type: Single
# Default value: 0.18
RopeSag = 0.22

## Player rope anchor height above feet (visual).
# Setting type: Single
# Default value: 1.1
RopePlayerAnchorUp = 1.05

## Moves rope start toward cart body along cart forward axis.
# Setting type: Single
# Default value: 0.85
RopeStartForwardNudge = 0.85

## Moves rope start up/down.
# Setting type: Single
# Default value: 0
RopeStartUpNudge = 0

## Moves rope start left/right.
# Setting type: Single
# Default value: 0
RopeStartSideNudge = 0

## If helper is farther than this from helper point for GraceSeconds, helping stops (0 disables).
# Setting type: Single
# Default value: 5.5
DetachDistance = 5.5

## How long helper must remain beyond DetachDistance before stopping.
# Setting type: Single
# Default value: 0.65
DetachGraceSeconds = 0.65

[UI]

## Show helper prompt on cart hover.
# Setting type: Boolean
# Default value: true
ShowHoverText = true

## Show a small center message when toggling helping.
# Setting type: Boolean
# Default value: true
ShowCenterMessages = true

