## Settings file was created by plugin Group Coin Split (Client Only) v2.0.0
## Plugin GUID: twentyonez.groupcoinsplit

[Debug]

## Se true, escreve logs de debug no client (e no server também, se o mod estiver instalado lá).
# Setting type: Boolean
# Default value: false
DebugLog = false

[General]

## Se true, o client redistribui Coins (loot de mobs) dropando perto dos colegas do grupo.
# Setting type: Boolean
# Default value: true
Enabled = true

## None: sem divisão
## EvenRemainderToPicker: divide igualmente, resto fica com quem pegou
## RoundRobin: resto distribuído 1 a 1 (ordem estável por UID)
# Setting type: DivisionMode
# Default value: EvenRemainderToPicker
# Acceptable values: None, EvenRemainderToPicker, RoundRobin
DivisionMode = EvenRemainderToPicker

## Raio (em metros) para considerar membros do grupo próximos.
# Setting type: Single
# Default value: 20
RangeMeters = 60

LockConfiguration = true

