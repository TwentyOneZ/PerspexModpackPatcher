## Settings file was created by plugin Tidy Chests v1.3.1
## Plugin GUID: muindor.TidyChests

[Browser]

## Opens and closes the list of everything in the chests in range, with a search box. Modifiers are allowed; set it to "None" to disable the panel.
# Setting type: KeyboardShortcut
# Default value: O + LeftControl
BrowserKey = BackQuote + LeftControl

## Width and height of the chest list panel in UI pixels.
# Setting type: Vector2
# Default value: {"x":520.0,"y":560.0}
BrowserSize = {"x":520.0,"y":560.0}

## Order of the chest list while its search box is empty. Click the Name or Count header in the list to change it, and click the active one again to flip it; the choice is saved here. While something is typed in the search box the best matches come first and this decides the order among equally good ones.
# Setting type: BrowserSort
# Default value: CountDescending
# Acceptable values: CountDescending, CountAscending, NameAscending, NameDescending
Sort = CountDescending

## Items pinned to the top of the chest list, comma-separated. Click the diamond on the left of a row to pin or unpin it; the list is saved here as you click. A pinned item stays in the list even when no chest in range holds it any more, shown with a count of 0, so you can see that it ran out. Pinning is ignored while you are searching. The names are the game's own item names: $item_wood, $item_coal, $item_ironscrap
# Setting type: String
# Default value: 
Favorites = $item_turnipseeds, $item_sledge_iron, $item_surtlingcore

[Button]

## Show the Stash button in the inventory. The console command 'tidychests stash' works without it.
# Setting type: Boolean
# Default value: true
ShowButton = true

## Position of the Stash button relative to the weight display of the inventory panel, in UI pixels (x right, y up).
# Setting type: Vector2
# Default value: {"x":41.0,"y":-56.0}
ButtonOffset = {"x":41.0,"y":-56.0}

## Width and height of the Stash button in UI pixels.
# Setting type: Vector2
# Default value: {"x":120.0,"y":38.0}
ButtonSize = {"x":120.0,"y":38.0}

[Find]

## With the inventory open, point at an item (in the inventory, or an ingredient or recipe in the crafting panel) and press this key: the inventory closes and every chest in range that holds the item is highlighted. Modifiers are allowed, e.g. "T + LeftControl".
# Setting type: KeyboardShortcut
# Default value: T
FindKey = BackQuote + LeftAlt

## Seconds the found chests stay highlighted.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 1 to 60
HighlightDuration = 8

## Draw an arrow with the item count and the distance over each found chest (at the screen edge when the chest is out of view).
# Setting type: Boolean
# Default value: true
ScreenMarker = true

## Light up each found chest with a pulsing light.
# Setting type: Boolean
# Default value: true
Light = true

## Tint each found chest with an emissive glow. Only works for materials whose shader has an emission colour.
# Setting type: Boolean
# Default value: true
Glow = true

## Close the inventory when chests are found, so the highlights are visible right away. When nothing is found the inventory stays open.
# Setting type: Boolean
# Default value: true
CloseInventory = true

[General]

## [synced] Enable this mod: the Stash button and the find key.
# Setting type: Boolean
# Default value: true
Enabled = true

## Log every item decision and every chest that is considered when stashing.
# Setting type: Boolean
# Default value: false
IsDebug = false

[Knowledge]

## [synced] Count the items lying in the chests in range as found, so their recipes unlock without carrying every stack yourself. Meant for co-op, where a team mate gathers a material you have never held. Trophies count too. This cannot be undone: turning the option off later does not lock a recipe again.
# Setting type: Boolean
# Default value: true
LearnFromChests = false

