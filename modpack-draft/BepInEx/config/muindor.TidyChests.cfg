## With the inventory open, point at an item and press this to lock or unlock it: a locked item is never stashed, wherever it lies. Modifiers are allowed.
# Setting type: KeyboardShortcut
# Default value: L + LeftShift
LockItemKey = L + LeftShift

## With the inventory open, point at a slot and press this to lock or unlock it: whatever lies in a locked slot is never stashed. Modifiers are allowed.
# Setting type: KeyboardShortcut
# Default value: K + LeftShift
LockSlotKey = K + LeftShift

## Items locked with the lock key, comma-separated, saved here as you press it. The names are the game's own item names: $item_wood, $item_coal
# Setting type: String
# Default value: 
LockedItems = 

## Inventory slots locked with the lock key, comma-separated as column:row counted from 0, the top row (the hotbar) being row 0: 0:1, 7:3. Saved here as you press the key.
# Setting type: String
# Default value: 
LockedSlots = 

[Scan]

## [synced] Chests within this many metres are read by the chest list and by the knowledge scan. Reading costs nothing on the network: the game already keeps the contents of every loaded chest on your client. Above roughly 90 m the chests are no longer loaded, so nothing more is found.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 5 to 90
ScanRadius = 50

## [synced] Seconds between two scans of the chests in range. Chests whose contents did not change are skipped, so a short interval is cheap.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 1 to 60
ScanInterval = 5

[Server]

## Server only, and off by default. Turn it on in the configuration of a dedicated server, or of the player hosting the session, to have every client that also has the mod run on the settings marked [synced] below instead of its own. The clients' own config files are never touched: their settings come back the moment they disconnect. This never makes the mod required on either side - players without it are unaffected, and a player with it can still join a server that does not have it.
# Setting type: Boolean
# Default value: false
ConfigPriority = false

[Stash]

## [synced] Chests within this many metres of the player are used, both by the Stash button and by the find key.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 20
Radius = 6

## [synced] Also stash items from the first inventory row (the hotbar).
# Setting type: Boolean
# Default value: false
IncludeHotbar = false

## [synced] Item types that may be stashed (comma-separated). Equipment, tools and weapons are left out by default. Valid types: None, Material, Consumable, OneHandedWeapon, Bow, Shield, Helmet, Chest, Ammo, Customization, Legs, Hands, Trophy, TwoHandedWeapon, Torch, Misc, Shoulder, Utility, Tool, Attach_Atgeir, Fish, TwoHandedWeaponLeft, AmmoNonEquipable, Trinket
# Setting type: String
# Default value: Material, Consumable, Ammo, AmmoNonEquipable, Trophy, Misc, Fish
ItemTypes = Material, Consumable, Ammo, AmmoNonEquipable, Trophy, Misc, Fish

## [synced] Items that are never stashed (comma-separated). Use prefab names or item names, for example: Wood, $item_coal, Resin
# Setting type: String
# Default value: 
Blacklist = 

## Show a message with the result after stashing.
# Setting type: Boolean
# Default value: true
ShowMessage = true

