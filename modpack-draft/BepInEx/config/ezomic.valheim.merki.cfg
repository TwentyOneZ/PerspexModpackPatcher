## Settings file was created by plugin Merki v1.0.0
## Plugin GUID: ezomic.valheim.merki

[Death]

## Put a gravestone on the other players' maps when a player dies, at the spot they died, with their name under it on the large map. Yours is already marked by the game, so you are never sent your own. Only a player's latest death is shown: dying again moves their gravestone rather than adding a second, or takes it off your map if the new spot is one you would not be shown. The server remembers each mark until it expires, so a player who joins or reconnects later still gets it, with only the time that is left. It follows the same rule as the map: a player whose position is private sends no mark, and Range and SameBiome decide who receives one, measured from where you are when the death happens, or where you first stand if you join afterwards - for a new character, where the valkyrie puts you down, not where it picks you up. Nothing is saved: a restarted server has forgotten every mark, and your own map drops them when you log out.
# Setting type: Boolean
# Default value: true
DeathMarks = true

## How long a gravestone stays on the map, in minutes, from 1 to 30. Counted from the death on the server's clock, so a player who joins twenty minutes after somebody died sees that mark for the last ten, not for a fresh thirty. Long enough to go and help is the point; a gravestone that stays turns the map into a graveyard by the second evening.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 1 to 30
DeathMarkMinutes = 30

[Merki]

## Off leaves the plugin loaded and changing nothing. Not 'unloaded' - a plugin cannot unload itself.
# Setting type: Boolean
# Default value: true
Enabled = true

## Write what was forced and what was hidden to BepInEx/LogOutput.log. Off unless something looks wrong; on a busy server it is chatty.
# Setting type: Boolean
# Default value: false
Verbose = false

[Visibility]

## Everyone is on everyone's map, whether they like it or not. The server overwrites the 'share position' flag each client sends, so unticking the box on the map does nothing - the box is not where the answer is kept. Each player's own choice is kept as it was, not overwritten, so off restores vanilla, where each player chooses.
# Setting type: Boolean
# Default value: true
ForcePublic = true

## Grey out the 'share position' checkbox on the map so it reads honestly. This changes nothing about who can see whom; it only stops a player believing they are hidden. Requires ForcePublic.
# Setting type: Boolean
# Default value: true
LockMapToggle = true

## How far away another player can be and still appear on your map, in metres. 0 means the whole world, which is the usual answer and the cheapest - at 0 the server sends its own untouched player list. A number here makes the map a local thing: you see who is near you and nobody else. Height is ignored, so a cave below you still counts as near. Measured from where each player last reported in. The game reports positions every two seconds and the list goes out every two seconds, so the edge lags by a few seconds of travel: a few steps on foot, tens of metres on a mount or a ship. Also a map rule, not an invisibility one - a player close enough for the game to stream them to you is on your connection anyway, so a very small Range hides them from the map only.
# Setting type: Single
# Default value: 0
Range = 0

## Only show players who are in the same biome as you. Combines with Range - both have to pass. Note that a crypt or a cave reads as the biome on the surface above it, because that is where the game says its coordinates are; a player underground is therefore still in the Swamp.
# Setting type: Boolean
# Default value: false
SameBiome = false

