[03 - Chest Scanner]

## Count materials found in nearby chests towards requirements.
# Setting type: Boolean
# Default value: false
EnableChestScanning = false

## Radius (meters) in which chests are scanned.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 5 to 100
ChestScanRange = 20

## How often (seconds) chests are re-scanned.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0,5 to 10
ChestScanInterval = 3

[04 - HUD Appearance]

## Global UI scale multiplier.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0,3 to 3
UIScale = 0.75

## Background panel opacity (0 = transparent, 1 = opaque).
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
BackgroundOpacity = 0.5

## Font size for recipe/group name in HUD pins.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 8 to 40
FontSizeRecipeName = 16

## Font size for material names and amounts in HUD pins.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 8 to 40
FontSizeMaterials = 15

## Size (px) of the recipe icon in the HUD pin header.
# Setting type: Int32
# Default value: 28
# Acceptable value range: From 12 to 64
HudRecipeIconSize = 28

## Size (px) of the material icons in the HUD pin resource list.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 10 to 48
HudMaterialIconSize = 20

## Size (px) of the group icon (stacked cards) in the HUD pin header.
# Setting type: Int32
# Default value: 28
# Acceptable value range: From 12 to 64
HudGroupIconSize = 28

## Show a colored accent bar indicating whether a recipe can be crafted.
# Setting type: Boolean
# Default value: true
EnableCraftReadiness = true

## On a recipe pinned more than once, append what one unit costs in brackets, e.g. 8/50(5). The bracket is colored on its own, so it turns green as soon as a single unit is affordable.
# Setting type: Boolean
# Default value: true
ShowSingleUnitRequirement = true

[05 - Colors]

## Recipe/group name text color.
# Setting type: Color
# Default value: FFCE00FF
ColorHeader = FFCE00FF

## Material amount color when you have enough in your inventory.
# Setting type: Color
# Default value: 00FF00FF
ColorEnoughInInventory = 00FF00FF

## Material amount color when enough only if chests are counted.
# Setting type: Color
# Default value: FFFF00FF
ColorEnoughWithChests = FFFF00FF

## Material amount color when materials are missing.
# Setting type: Color
# Default value: FF5454FF
ColorMissing = FF5454FF

## Accent bar color when all materials are available.
# Setting type: Color
# Default value: 33E64CD9
ColorCraftReady = 33E64CD9

## Accent bar color when materials are missing.
# Setting type: Color
# Default value: E6404080
ColorCraftNotReady = E6404080

[06 - Pagination]

## Active page indicator dot color.
# Setting type: Color
# Default value: FFB75EFF
ColorPaginationActive = FFB75EFF

## Opacity of inactive page indicator dots.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0,1 to 1
PaginationInactiveOpacity = 0.3

## Size of the pagination dot squares.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 5 to 20
PaginationDotSize = 10

## Space between pagination squares.
# Setting type: Int32
# Default value: 8
# Acceptable value range: From 0 to 20
PaginationDotSpacing = 8

[07 - Gathering List]

## Enable the Gathering List (aggregated material overview).
# Setting type: Boolean
# Default value: true
EnableGatheringList = true

## Automatically open the Gathering List when 2+ recipes are pinned.
# Setting type: Boolean
# Default value: true
AutoOpenGatheringList = true

## Number of columns in the Gathering List grid (horizontal modes only). Panel width adjusts proportionally.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 10
GatheringListColumns = 4

## Font size for the Gathering List title.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 8 to 40
GatheringListFontSizeTitle = 20

## Font size for material amounts in the Gathering List.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 8 to 40
GatheringListFontSizeMaterials = 15

## Gap between the container window's top-right corner and the Gathering List's top-left corner, when a chest is open. X is to the right, Y is up. Values with a negative X are from the pre-1.3.1 screen-centre scheme and are ignored in favour of the default.
# Setting type: Vector2
# Default value: {"x":90.0,"y":2.0}
ContainerGatheringListPosition = {"x":90.0,"y":2.0}

[08 - Groups]

## Number of unique materials above which a group pin switches to compact (grid) layout. Default: 4 (triggers at 5+).
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 10
GroupCompactThreshold = 4

## Number of grid rows a compact group pin shows before collapsing the rest into a "+N" cell. Default: 3.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 10
GroupCompactMaxRows = 3

## Font size of the member count number displayed on the group icon.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 8 to 32
GroupIconFontSize = 16

[09 - My Pins Panel]

## Width of the My Pins panel.
# Setting type: Single
# Default value: 375
# Acceptable value range: From 200 to 600
PanelWidth = 375

## Height of the My Pins panel.
# Setting type: Single
# Default value: 480
# Acceptable value range: From 200 to 800
PanelHeight = 480

## Position offset (X, Y) of the My Pins panel from the screen center. (0, 0) = perfectly centered.
# Setting type: Vector2
# Default value: {"x":0.0,"y":0.0}
PanelPosition = {"x":0.0,"y":0.0}

## Tint color of the pin icon on the My Pins button (default: #ffa13d).
# Setting type: Color
# Default value: FFA13DFF
ButtonIconColor = FFA13DFF

## Position offset (X, Y) of the My Pins button from the inventory.
# Setting type: Vector2
# Default value: {"x":-520.0,"y":507.0}
MyPinsButtonPosition = {"x":-520.0,"y":507.0}

## Size of the My Pins icon button in pixels.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 20 to 200
MyPinsButtonSize = 30

## Size of each material icon on a pin's materials strip, in pixels.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 8 to 64
MaterialIconSize = 18

## Font size of the have/required amount next to each material icon.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 6 to 32
MaterialFontSize = 12

## Height the materials strip adds to each pin row. Raising it makes rows taller, so fewer of them fit in the panel at a given PanelHeight.
# Setting type: Single
# Default value: 24
# Acceptable value range: From 12 to 80
MaterialStripHeight = 24

