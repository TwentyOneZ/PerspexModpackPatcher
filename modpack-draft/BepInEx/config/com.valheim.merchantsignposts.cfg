## Settings file was created by plugin MerchantSignposts v0.1.0
## Plugin GUID: com.valheim.merchantsignposts

[Merchants]

## Comma-separated 'locationPrefab=label' pairs. The prefab is the vanilla location name in ZoneSystem; the label is written on signs.
# Setting type: String
# Default value: Vendor_BlackForest=Haldor,Hildir_camp=Hildir,BogWitch_Camp=Bog Witch
Table = Vendor_BlackForest=Haldor,Hildir_camp=Hildir,BogWitch_Camp=Bog Witch

[Placement]

## Place and reconcile world signposts. Disable to leave existing signposts untouched.
# Setting type: Boolean
# Default value: true
WorldPlacement = true

## Trails per merchant candidate.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 64
Spokes = 6

## Outer trail radius in metres. Restart to apply placement settings.
# Setting type: Single
# Default value: 600
OuterRadius = 600

## Inner trail radius in metres; must not exceed OuterRadius.
# Setting type: Single
# Default value: 150
InnerRadius = 150

## Positive distance between trail points in metres.
# Setting type: Single
# Default value: 150
Step = 150

## Maximum sideways displacement in metres.
# Setting type: Single
# Default value: 20
SidewaysJitter = 20

## Clearance beyond other reserved locations' radii in metres.
# Setting type: Single
# Default value: 32
LocationMargin = 32

## Minimum elevation above sea level in metres.
# Setting type: Single
# Default value: 2
WaterMargin = 2

## Per-merchant minimum elevation above sea level as 'locationPrefab=metres' pairs, overriding WaterMargin. Swamp terrain lies within about two metres of the water line, so the Bog Witch needs a small margin or no trail point survives. Restart to apply.
# Setting type: String
# Default value: BogWitch_Camp=0.25
WaterMargins = BogWitch_Camp=0.25

## Per-merchant trail density as 'locationPrefab=field:value;field:value' pairs, where the fields are spokes, outer, inner and step and override Spokes, OuterRadius, InnerRadius and Step for that merchant. Most swamp candidates are under water, so the Bog Witch gets five times the candidates to end up with a comparable number of signs. Restart to apply.
# Setting type: String
# Default value: BogWitch_Camp=spokes:12;step:50
Trails = BogWitch_Camp=spokes:12;step:50

## Per-merchant trail biomes as 'locationPrefab=Biome|Biome' pairs using Heightmap.Biome names (Meadows, BlackForest, Swamp, Mountain, Plains, Mistlands, AshLands, DeepNorth, Ocean). Merchants without an entry use their location's own biome. Swamps are small, so a Bog Witch trail gains many points from 'BogWitch_Camp=Swamp|BlackForest' at the cost of leaving the swamp. Restart to apply.
# Setting type: String
# Default value: 
Biomes = 

[Signpost]

## Vanilla piece used as the vertical post for merchants without an entry in PolePrefabs.
# Setting type: String
# Default value: wood_pole2
PolePrefab = wood_pole2

## Per-merchant post override as 'locationPrefab=piece' pairs, so each merchant's signposts are built from a material that suits them. Any vanilla pole with a BoxCollider works; the board is hung from its measured top. Signposts standing on a different post are rebuilt at the next sweep.
# Setting type: String
# Default value: Vendor_BlackForest=piece_dvergr_pole,BogWitch_Camp=darkwood_pole
PolePrefabs = Vendor_BlackForest=piece_dvergr_pole,BogWitch_Camp=darkwood_pole

## Vanilla piece used as the board. Must carry a Sign component so text renders.
# Setting type: String
# Default value: sign
SignPrefab = sign

## Metres the bottom of the post sits below ground level.
# Setting type: Single
# Default value: 0.3
PoleEmbedDepth = 0.3

## Horizontal distance from the post's axis to the board's inner end, along the pointing direction. 0.2 puts the inner end on the surface of the 0.4 m post so no letters are hidden inside it; 0 overlaps half the post and hides the last letter.
# Setting type: Single
# Default value: 0.2
SignInnerEndOffset = 0.2

## Metres the board's top edge sits below the top of the post.
# Setting type: Single
# Default value: 0
SignDropBelowPoleTop = 0

## Sign text. {merchant} is replaced by the label from the merchant table.
# Setting type: String
# Default value: {merchant}
TextTemplate = {merchant}

## Per-merchant label colour as 'locationPrefab=colour' pairs. The sign text is wrapped in a rich-text <color> tag; use a hex value like #E3B341 or a TextMeshPro colour name. Merchants without an entry keep the vanilla text colour. Signposts whose text differs are rebuilt at the next sweep.
# Setting type: String
# Default value: Vendor_BlackForest=#E3B341,Hildir_camp=#E48BD2,BogWitch_Camp=#8CC63F
TextColors = Vendor_BlackForest=#E3B341,Hildir_camp=#E48BD2,BogWitch_Camp=#8CC63F

## Rotate the board 180 degrees about the post so its text faces the other side. The board still extends toward the merchant.
# Setting type: Boolean
# Default value: false
FlipFace = false

## Log measured prefab bounds and the computed poses on every placement.
# Setting type: Boolean
# Default value: false
LogGeometry = false

[Trigger]

## A player-written sign whose text starts with this, followed by a merchant name, is consumed and replaced by a fingerpost pointing at that merchant.
# Setting type: String
# Default value: !signpost
TriggerPrefix = !signpost

## Only honour trigger signs written by players in the server's adminlist.txt. Other players see the sign text change to a refusal.
# Setting type: Boolean
# Default value: true
RequireAdmin = true

## Seconds between sweeps of the world's sign objects for triggers.
# Setting type: Single
# Default value: 2
SweepInterval = 2

