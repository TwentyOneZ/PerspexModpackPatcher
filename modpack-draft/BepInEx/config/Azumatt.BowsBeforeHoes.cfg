[1 - General]

## If on, the configuration is locked and can be changed by server admins only. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Lock Configuration = On

[2 - Bow Zoom]

## Lets you zoom in while drawing a bow by holding the Bow Zoom Hotkey. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Bow Zoom = On

## Zoom in on every draw without holding the hotkey. [Not Synced with Server]
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Automatic Bow Zoom = Off

## How far the zoom goes. 2 halves the field of view. [Not Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 5
Zoom Factor = 2

## Seconds the zoom takes to reach full. 1 is recommended. [Not Synced with Server]
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 5
Bow Zoom Constant Time = 1

## Seconds you stay zoomed after loosing an arrow while still holding the zoom key, so you can see it land. [Not Synced with Server]
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 10
Stay In-Zoom Time = 2

[3 - Keyboard Shortcuts]

## Hold while drawing to zoom. Mouse0: Left Click, Mouse1: Right Click, Mouse2: Middle Click. For the other inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: Mouse1
Bow Zoom Hotkey = Mouse1

## Lets go of a drawn bow without firing. Mouse0: Left Click, Mouse1: Right Click, Mouse2: Middle Click. For the other inputs: https://docs.unity3d.com/ScriptReference/KeyCode.html [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: E
Bow Draw Cancel Hotkey = E

[4 - Other]

## If off, hides the normal crosshair. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Crosshair = On

## If off, hides the crosshair that shows while drawing a bow. [Not Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Bow Crosshair = On

## Chance a shot arrow drops back as an item where it lands. 0.5 is 50%. Arrows spent by their effect (Signal, Snare, Aegis, Rift and so on) never come back. The Runed and Bonecrest quiver perks add to this, at 1 they have nothing left to give. [Synced with Server]
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Spawn Arrow Chance = 0.5

## If on, drawing a bow drops you to a walk until you let go. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Bow Draw Movement Speed Reduction = On

## Log what each special arrow did (who a burst hit, why a rift fizzled, when a dome collapsed) to the console and top-left of the screen. The bbh_arrowtest console command turns this on. [Not Synced with Server]
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Log Special Arrow Effects = Off

