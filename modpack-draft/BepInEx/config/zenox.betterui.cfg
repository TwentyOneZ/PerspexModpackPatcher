[ItemLevelStars]

## If true, shows item quality as yellow star icons directly on the item icon in the inventory grid, instead of vanilla's plain number.
# Setting type: Boolean
# Default value: true
Enabled = true

## If true, also shows item quality as star icons on the hotbar (slots 1-8). If false, the hotbar stays vanilla (no quality indicator there at all - vanilla never had one), while the inventory grid above is still controlled by Enabled.
# Setting type: Boolean
# Default value: true
HotbarEnabled = true

## Font size of the quality stars in the inventory grid.
# Setting type: Int32
# Default value: 11
InventoryFontSize = 11

## Font size of the quality stars on the hotbar (slots 1-8) - matches the inventory size by default.
# Setting type: Int32
# Default value: 11
HotbarFontSize = 11

[Party]

## Enables the party system (/invite <name> and /partyleave chat commands) and the party HP display in the HUD.
# Setting type: Boolean
# Default value: true
Enabled = true

## If true, shows the HP bar for each party member in the party HUD panel.
# Setting type: Boolean
# Default value: true
ShowHpBar = true

## If true, shows the stamina bar for each party member in the party HUD panel.
# Setting type: Boolean
# Default value: true
ShowStaminaBar = true

[UpgradePreviewTooltip]

## If true, hovering an upgradeable item at a workbench/forge with a higher quality selected shows an 'old -> new' comparison for every stat that would actually increase.
# Setting type: Boolean
# Default value: true
Enabled = true

