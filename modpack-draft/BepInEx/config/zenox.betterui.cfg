## Settings file was created by plugin BetterUI v1.0.12
## Plugin GUID: zenox.betterui

[CharacterLevel]

## If true, shows a combined character level (sum of all skill XP) as an XP bar at the bottom of the HUD, with a level-up message.
# Setting type: Boolean
# Default value: true
Enabled = false

[CharacterSelectStats]

## If true, shows kills/deaths/crafts/builds under the character name on the character-select screen.
# Setting type: Boolean
# Default value: true
Enabled = true

## Font size of the kills/deaths/crafts/builds line.
# Setting type: Int32
# Default value: 22
FontSize = 22

## Moves the character name (and the stats line under it) up by this many UI pixels, to avoid the stats line hanging into the cloud-save indicator below it.
# Setting type: Single
# Default value: 22
YOffset = 22

[CombinedStatsTooltip]

## If true, hovering the armor value in the character panel shows a combined weapon/block/armor/movement stat summary instead of nothing.
# Setting type: Boolean
# Default value: true
Enabled = true

[DurabilityColor]

## If true, colors the item durability bar green/yellow/orange/red by remaining percentage instead of vanilla's single color.
# Setting type: Boolean
# Default value: true
Enabled = true

[EnemyLevelDisplay]

## How enemy level is shown. 0 = vanilla's own star icons only, 1 = text star prefix (same style as item quality stars) instead of vanilla's icons, 2 = both.
# Setting type: Int32
# Default value: 1
Style = 1

## If true, shows a 'current/max' HP number under enemy nameplates.
# Setting type: Boolean
# Default value: true
ShowHpText = false

## Font size of the HP number on regular enemy health bars.
# Setting type: Int32
# Default value: 11
HpTextFontSize = 11

## Font size of the HP number on the (larger) boss health bar.
# Setting type: Int32
# Default value: 18
BossHpTextFontSize = 18

## Multiplies how far away enemy HUDs (health bar/nameplate) become visible. 1 = vanilla default.
# Setting type: Single
# Default value: 1
DistanceMultiplier = 1

## If true, tints the enemy name white/yellow/red depending on whether it's aware of or alerted to the player.
# Setting type: Boolean
# Default value: true
ColorNameByAlertState = false

## Scale multiplier for the enemy health bar (width and height). 1 = vanilla size.
# Setting type: Single
# Default value: 1.1
HealthBarScale = 1.1

## Extra scale multiplier applied to the bar's HEIGHT only, on top of HealthBarScale - makes the bar taller/thicker without also widening it further.
# Setting type: Single
# Default value: 1.5
HealthBarHeightScale = 1.5

## Moves the enemy name up by this many UI pixels, to make room for the bigger bar/HP text below it.
# Setting type: Single
# Default value: 2
NameYOffset = 2

## Vertical gap between the enemy name and the HP text below it.
# Setting type: Single
# Default value: 11
HpTextGap = 11

## If true, hides the dark background panel behind the enemy health bar.
# Setting type: Boolean
# Default value: true
HideBarBackground = false

## Enemy HUD (bar/nameplate) is always shown for any enemy within this distance, instead of only appearing while the crosshair is aimed at it. 0 = disabled (vanilla hover-only behavior).
# Setting type: Single
# Default value: 30
AlwaysShowDistance = 30

[HoverText]

## If true, adds extra info lines to container/fermenter/cooking station hover text.
# Setting type: Boolean
# Default value: true
Enabled = true

## How chest fullness is shown. 0 = off, 1 = % used, 2 = items/max, 3 = free slots.
# Setting type: Int32
# Default value: 3
ContainerStyle = 3

## How fermenter progress is shown while brewing. 0 = off, 1 = % done, 2 = mm:ss remaining.
# Setting type: Int32
# Default value: 2
FermenterStyle = 2

## How cooking progress is shown per slot. 0 = off, 1 = % done, 2 = mm:ss remaining.
# Setting type: Int32
# Default value: 2
CookingStationStyle = 2

[HudEditor]

## Toggle HUD edit mode: while active, drag a bar's proxy box with the left mouse button to move it, scroll while hovering it to resize it.
# Setting type: KeyboardShortcut
# Default value: F7
EditModeKey = F7

## If true, logs the full HUD canvas hierarchy (every active UI element's name and path) once each time edit mode is turned on - use this to find the exact name of an element (vanilla, ours, or from another mod) to enter in CustomTargetNames.
# Setting type: Boolean
# Default value: false
DumpHudHierarchyOnEdit = false

## Comma-separated GameObject names to make movable/scalable in edit mode alongside the built-in bars, e.g. 'karma_icon,SomeOtherModPanel'. Only needed for elements AutoDetectHudElements can't reach (nested deeper than a direct hudroot child) - use DumpHudHierarchyOnEdit to find the exact name of the element you want.
# Setting type: String
# Default value: 
CustomTargetNames = 

## If true, automatically finds and makes movable any top-level HUD panel that isn't already covered by a built-in bar or CustomTargetNames - including ones added by other mods - with no need to enter names manually. Re-checked continuously while edit mode is on, so panels that only appear later (e.g. after first use) get picked up live.
# Setting type: Boolean
# Default value: true
AutoDetectHudElements = true

