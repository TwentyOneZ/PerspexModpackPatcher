## Settings file was created by plugin PerspexCharacterAuthority v1.0.5
## Plugin GUID: TwentyOneZ.PerspexCharacterAuthority

[Access]

## Bind each account to one persistent CharacterId.
# Setting type: Boolean
# Default value: true
SingleCharacterPerAccount = true

[Authority]

## Fail closed when a multiplayer server does not complete the PCA handshake.
# Setting type: Boolean
# Default value: true
RequireServerAuthority = true

## Seconds to wait for the PCA handshake (clamped to 5-60).
# Setting type: Int32
# Default value: 15
HandshakeTimeoutSeconds = 15

[Backups]

## Keep rotating snapshots before replacement.
# Setting type: Boolean
# Default value: true
Enabled = true

## Maximum backups retained per character.
# Setting type: Int32
# Default value: 10
MaximumBackupsPerCharacter = 10

[Diagnostics]

## Off, Basic, Verbose, or Trace.
# Setting type: String
# Default value: Basic
Level = Off

## Write a dedicated PCA diagnostic log per process.
# Setting type: Boolean
# Default value: true
WriteDiagnosticFile = true

## Mirror diagnostic events through ZLog.
# Setting type: Boolean
# Default value: true
MirrorToGameLog = true

## Pending state log interval, clamped to 0.25-60 seconds.
# Setting type: Single
# Default value: 1
PendingStateIntervalSeconds = 1

[FirstJoin]

## PreserveCharacter or FreshProgression.
# Setting type: String
# Default value: PreserveCharacter
Mode = FreshProgression

[General]

## Enable server-authoritative character snapshots.
# Setting type: Boolean
# Default value: true
Enabled = true

## Legacy switch; enables at least Verbose diagnostics.
# Setting type: Boolean
# Default value: false
DebugLogging = false

[Limits]

## Maximum accepted snapshot payload.
# Setting type: Int32
# Default value: 16
MaxSnapshotSizeMB = 16

[Saving]

## Client snapshot submit interval.
# Setting type: Int32
# Default value: 300
AutosaveIntervalSeconds = 300

## Submit the local snapshot during teardown.
# Setting type: Boolean
# Default value: true
SaveOnLogout = true

## Submit the local snapshot when the network object is destroyed.
# Setting type: Boolean
# Default value: true
SaveOnDisconnect = true

## Submit the local snapshot during application shutdown.
# Setting type: Boolean
# Default value: true
SaveOnServerShutdown = true

