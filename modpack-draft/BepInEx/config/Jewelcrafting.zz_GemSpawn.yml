# Jewelcrafting spawn distribution: stock + EpicJewels + MyriadJewels
#
# Goals:
# - Total chance of ANY gemstone formation per candidate spawner: 0.10 (10%).
#   Stock Jewelcrafting is 0.50 (50%), so gemstones overall are 5x rarer.
# - EpicJewels gems are 3x rarer than the corresponding standard-color gem.
# - MyriadJewels gems are 5x rarer than the corresponding standard-color gem.
# - Color affinity follows stock Jewelcrafting biome colors.
#
# Color mapping:
# Epic: jade=green, amber=yellow, aquamarine=blue, garnet=red, opal=white, amethyst=purple
# Myriad: howlite=white, carnelian=orange, bloodstone=red, pyrite=yellow,
#         hematite=black, tourmaline=purple, mossagate=green
#
# IMPORTANT: Enable 'Use External YAML = On' in Jewelcrafting's .cfg.
# Recommended filename: Jewelcrafting.zz_GemSpawn.yml (loads late among external YAMLs).

