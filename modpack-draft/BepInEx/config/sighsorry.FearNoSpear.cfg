## Settings file was created by plugin FearNoSpear v1.0.8
## Plugin GUID: sighsorry.FearNoSpear

[General]

## Locks the synchronized gameplay settings to the server's config when the mod is installed on a server. Keep this on for multiplayer servers so every client uses the same spear rescue timing, ownership safety, and tombstone access rules. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Lock Configuration = On

## Master switch for all FearNoSpear behavior. When disabled, spear protection, the chat locator, death pin cleanup, and tombstone access protection are all inactive. [Synced with Server]
# Setting type: Boolean
# Default value: true
Enabled = true

## Chat command used to pin known thrown spear locations on the minimap, nearest first. The comparison is case-insensitive and the command is consumed locally instead of being sent to public chat. Server operators can change this value, such as !spear or !lostspear, and lock it through ServerSync. Leave it empty to disable the chat command. [Synced with Server]
# Setting type: String
# Default value: !myspear
ChatCommand = !myspear

## Removes the vanilla death map pin when the local player's tombstone is recovered, and suppresses the death pin when a death creates no tombstone. This setting is synchronized so server operators can keep the same behavior for all clients. [Synced with Server]
# Setting type: Boolean
# Default value: true
CleanDeathPins = true

## Prevents players from opening or auto-looting a tombstone owned by another player. A server administrator or the local host can bypass the lock only while Valheim devcommands and debug mode are active. When the optional Clan mod is installed, members of the local player's active Clan roster, including Guests, may also recover it. Tombstones without a valid owner ID remain accessible so malformed or uninitialized tombstones are not permanently locked. This setting is synchronized and enabled by default. [Synced with Server]
# Setting type: Boolean
# Default value: true
OwnerOnlyTombstones = true

[Rescue]

## How close to projectile TTL expiry the mod should rescue a still-airborne tracked spear. A value of 1.0 means the stored spear item is respawned during the final second of projectile lifetime if no normal hit occurred. Increase this if projectiles are still being cleaned up before rescue; decrease it if rescued spears feel like they stop flying too early. [Synced with Server]
# Setting type: Single
# Default value: 1
TTLRescueWindowSeconds = 1

## Allows a rescue attempt when the projectile ZNetView has already become invalid, but only if this client was the most recent known owner. This helps recover spears lost during unload, ownership disruption, or network cleanup. Disable it if multiplayer testing shows duplicate rescued spears. [Synced with Server]
# Setting type: Boolean
# Default value: true
AllowLastKnownOwnerIfZNetViewInvalid = true

## Maximum age, in seconds, for the last-known owner state used by the invalid-ZNetView fallback. Lower values reduce duplicate-spawn risk but may miss late cleanup cases; higher values are more forgiving but less conservative in multiplayer. [Synced with Server]
# Setting type: Single
# Default value: 2
LastKnownOwnerGraceSeconds = 2

