## Settings file was created by plugin ChestGrid v1.0.0
## Plugin GUID: ChestGrid

[Chest Detection]

## Comma-separated prefab names treated as normal wooden chests.
# Setting type: String
# Default value: piece_chest_wood
NormalChestPrefabNames = piece_chest_wood

## Comma-separated Piece.m_name values treated as normal wooden chests.
# Setting type: String
# Default value: $piece_chestwood
NormalChestPieceNames = $piece_chestwood

[Controls]

## Disable ChestGrid snapping while Left Shift or Right Shift is held.
# Setting type: Boolean
# Default value: true
DisableWhileShiftHeld = true

[General]

## Enable ChestGrid.
# Setting type: Boolean
# Default value: true
Enabled = true

[Performance]

## Seconds between expensive chest list refreshes while placing a wooden chest.
# Setting type: Single
# Default value: 1
ChestCacheInterval = 1

[Snapping]

## Maximum distance from the placement ghost to a chest grid slot before snapping.
# Setting type: Single
# Default value: 1.55
SnapRange = 1.55

## Local left/right spacing between normal wooden chests.
# Setting type: Single
# Default value: 1.28
GridWidth = 1.28

## Local front/back spacing between normal wooden chests.
# Setting type: Single
# Default value: 0.74
GridDepth = 0.74

## Vertical spacing for stacked normal wooden chests.
# Setting type: Single
# Default value: 1.05
GridHeight = 1.05

## Maximum distance to vertical chest stack slots. Higher values make stacking easier to hit.
# Setting type: Single
# Default value: 1.8
VerticalSnapRange = 1.8

## Small upward offset applied to snapped vertical chest positions when placement height is not used.
# Setting type: Single
# Default value: 0.08
PlacementYOffset = 0.08

## For vertical rows, keep the hammer placement height from the wood/floor and only snap horizontal chest grid coordinates.
# Setting type: Boolean
# Default value: true
UsePlacementHeightForVerticalSnap = true

## Minimum distance to another normal wooden chest before a grid slot is treated as occupied.
# Setting type: Single
# Default value: 0.35
OccupiedRadius = 0.35

## Rotate the placement ghost to match the chest it snaps to.
# Setting type: Boolean
# Default value: true
SnapRotation = true

