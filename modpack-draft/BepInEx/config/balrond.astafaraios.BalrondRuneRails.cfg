[Coupling]

## Enables automatic cart coupling after placement/manual repositioning. Manual coupling remains available when disabled.
# Setting type: Boolean
# Default value: true
AutoCoupling = true

## Maximum coupler distance used by automatic coupling.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0,05 to 2
AutoCoupleRadius = 0.35

[Debug]

## Client-only Rune Rails debug logging. Leave disabled for normal play.
# Setting type: Boolean
# Default value: false
EnableDebugLogging = false

## Client-only detailed AudioRoutingService logging. Leave disabled unless diagnosing audio routing.
# Setting type: Boolean
# Default value: false
EnableAudioRoutingDebugLogging = false

[General]

## If enabled, gameplay configuration is controlled by the server/host through ServerSync.
# Setting type: Boolean
# Default value: true
LockConfiguration = true

[Signals]

## Maximum configurable range for standard rail/cart signal emitters.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 1 to 250
SignalMaximumRange = 50

## Maximum configurable range for presence signal emitters.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 1 to 250
PresenceSignalMaximumRange = 50

## Maximum configurable range for day/night signal emitters.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 500
DayNightSignalMaximumRange = 100

## Maximum configurable signal delay/uphold/event duration in seconds.
# Setting type: Single
# Default value: 120
# Acceptable value range: From 0 to 600
MaximumSignalDuration = 120

[Speed Rails]

## Speed multiplier applied while the powered cart is on a speed rail.
# Setting type: Single
# Default value: 1.75
# Acceptable value range: From 0,1 to 4
SpeedRailMultiplier = 1.75

[Train]

## Scales the powered cart's normal cruise/minimum speed. Temporary speed-rail boost limits remain separate.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 4
TrainSpeedMultiplier = 1

## Maximum normal train speed before temporary speed-rail boost headroom is applied.
# Setting type: Single
# Default value: 16
# Acceptable value range: From 1 to 64
MaximumTrainSpeed = 16

## Enables the existing straight-track acceleration bonus. Disabling it leaves base movement intact.
# Setting type: Boolean
# Default value: true
StraightRunAcceleration = true

## Enables uphill/downhill speed and momentum effects. Disabling it leaves base movement intact.
# Setting type: Boolean
# Default value: true
SlopeSpeedEffects = true

[Train Damage]

## Enables powered leading-cart collision damage while moving above the built-in threshold.
# Setting type: Boolean
# Default value: true
EnableRunDamage = true

## Global multiplier applied after the existing speed/cart-count run-damage curve.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
RunDamageMultiplier = 1

## Global multiplier applied after the existing run-damage knockback curve.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
RunKnockbackMultiplier = 1

