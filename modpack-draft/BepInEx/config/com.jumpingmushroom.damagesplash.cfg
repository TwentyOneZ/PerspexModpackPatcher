[4 Animation]

## Vanilla: straight drift up. Pop: vanilla drift with a scale-in. Arc: pop plus gravity and a little spray. Fountain: high and wide. Bounce: lands and bounces once. Choosing one overwrites the entries below.
# Setting type: String
# Default value: Arc
# Acceptable values: Vanilla, Pop, Arc, Fountain, Bounce, Custom
AnimPreset = Arc

## Seconds on screen. Vanilla: 1.5.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 0,2 to 10
Duration = 1.8

## Scale the number appears at before settling to 1. 1 disables the pop.
# Setting type: Single
# Default value: 1.8
# Acceptable value range: From 0,2 to 4
PopFrom = 1.8

## Seconds the pop takes to settle.
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From 0 to 1
PopDuration = 0.18

## How far the pop settles past its resting size before coming back, 0 to 1. 0 is a plain ease-out.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Overshoot = 0.5

## Seconds the number takes to fade in. 0 makes it appear at once, as vanilla does.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 0,5
FadeIn = 0.05

## Degrees. Each number is rotated by a random angle up to this, so a run of hits does not read as a printed column.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 0 to 30
Tilt = 6

## Initial upward speed in metres per second. Vanilla: 1.
# Setting type: Single
# Default value: 2.2
# Acceptable value range: From 0 to 10
RiseSpeed = 2.2

## Downward acceleration in metres per second squared. 0 is vanilla's straight drift.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 30
Gravity = 4

## Degrees. The launch direction is tilted off vertical by a random angle up to this, in a random direction.
# Setting type: Single
# Default value: 35
# Acceptable value range: From 0 to 90
Spray = 35

## Scale the number shrinks to over its last third while fading. 1 disables the shrink.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0,1 to 1,5
ExitShrink = 0.7

## Numbers that fall below their spawn height bounce once.
# Setting type: Boolean
# Default value: false
Bounce = false

## Random offset of the spawn point in metres, so overlapping hits separate. Vanilla: 0.5.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 2
Jitter = 0.3

[5 Hits]

## Read the hit behind each number, which is what sneak, crit, kill, elemental tints and magnitude all rest on. Off means every number is styled by its kind alone, as vanilla does. Only hits resolved on your own machine carry this: yours on things you own, and everything that hits you.
# Setting type: Boolean
# Default value: true
UseHitContext = true

## Size the number by how much the hit mattered. With hit context that is a share of the target's maximum health, so 30 on a greyling reads big and 30 on a fuling berserker does not; without it, by the raw number.
# Setting type: Boolean
# Default value: true
MagnitudeScaling = true

## Colour plain hits by their damage type. Weak, resistant and immune hits keep their own colour, because what they say is worth more than a tint.
# Setting type: Boolean
# Default value: true
ElementalTints = true

## Mark sneak attacks, the multiplier Valheim gives for hitting an unaware target.
# Setting type: Boolean
# Default value: true
SneakEnabled = true

## Mark hits on a staggered creature, which Valheim doubles. This is the closest thing the game has to a critical hit.
# Setting type: Boolean
# Default value: true
CritEnabled = true

## Mark the blow that kills.
# Setting type: Boolean
# Default value: true
KillEnabled = true

## Word shown with a sneak attack. Empty for none.
# Setting type: String
# Default value: SNEAK
SneakTag = SNEAK

## Word shown with a hit on a staggered creature. Empty for none.
# Setting type: String
# Default value: CRIT
CritTag = CRIT

## Word shown with a killing blow. Empty for none. Try SKAL or VALHALLA.
# Setting type: String
# Default value: KILL
KillTag = KILL

## Colour of a sneak attack.
# Setting type: Color
# Default value: FFD94CFF
SneakColor = FFD94CFF

## Colour of a hit on a staggered creature.
# Setting type: Color
# Default value: FF8C26FF
CritColor = FF8C26FF

## Colour of a killing blow.
# Setting type: Color
# Default value: FF4C40FF
KillColor = FF4C40FF

## How much longer a killing blow stays on screen.
# Setting type: Single
# Default value: 1.6
# Acceptable value range: From 1 to 4
KillDurationScale = 1.6

## Size of the tag word relative to the number.
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0,2 to 1,5
TagScale = 0.55

## Tint for fire damage.
# Setting type: Color
# Default value: FF8026FF
FireColor = FF8026FF

## Tint for frost damage.
# Setting type: Color
# Default value: 8CD9FFFF
FrostColor = 8CD9FFFF

## Tint for lightning damage.
# Setting type: Color
# Default value: FFF280FF
LightningColor = FFF280FF

## Tint for poison damage.
# Setting type: Color
# Default value: 8CE64CFF
PoisonColor = 8CE64CFF

## Tint for spirit damage.
# Setting type: Color
# Default value: D9F2FFFF
SpiritColor = D9F2FFFF

