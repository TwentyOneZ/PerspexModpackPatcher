[7 Merging]

## Seconds. Burning, poison and the other ticks on one victim add into a single number that climbs, instead of stacking up one per tick. 0 turns it off.
# Setting type: Single
# Default value: 1.2
# Acceptable value range: From 0 to 5
DotMergeWindow = 1.2

## The same for ordinary hits on one target, for volleys and multi-hit swings. 0 (the default) keeps every hit its own number, which is usually what you want to read.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 5
HitMergeWindow = 0

## Seconds. A climbing number stops accepting more after this long and a fresh one starts, so something burning forever does not leave one number on screen forever.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 30
MergeMaxLife = 6

[8 Self]

## All: every number, as vanilla does. Mine: only hits you dealt and damage done to you. None: no damage numbers at all, though blocks, heals and bonuses still show. Only hits resolved on your own machine can be told apart, so in multiplayer Mine also hides other people's hits on creatures they own.
# Setting type: String
# Default value: All
# Acceptable values: All, Mine, None
Visibility = All

## Flash the edges of the screen when you take a heavy hit.
# Setting type: Boolean
# Default value: true
EdgeFlash = true

## Share of your maximum health a hit must take to flash the screen.
# Setting type: Single
# Default value: 0.12
# Acceptable value range: From 0,01 to 1
EdgeFlashPercent = 0.12

## Colour of the flash. The alpha is how strong it gets at its peak.
# Setting type: Color
# Default value: B200008C
EdgeFlashColor = B200008C

## Seconds the flash takes to fade out.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0,1 to 3
EdgeFlashFade = 0.6

## How far in from the edge the flash reaches, as a share of half the screen.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0,05 to 1
EdgeFlashThickness = 0.35

[9 Compatibility]

## Another mod that redraws the damage numbers (ColorfulDamage, ZenCombat) claims the same method, and whichever runs first silently wins. With this on, DamageSplash stands aside and lets the other one draw.
# Setting type: Boolean
# Default value: true
YieldToOtherMods = true

## Pretend a conflicting mod is installed, to check what this mod does about it.
# Setting type: Boolean
# Default value: false
DebugSimulateConflict = false

