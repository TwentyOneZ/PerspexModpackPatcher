## Settings file was created by plugin DamageSplash v0.1.2
## Plugin GUID: com.jumpingmushroom.damagesplash

[1 General]

## Turn the mod off and the vanilla renderer takes over on the next hit.
# Setting type: Boolean
# Default value: true
Enabled = true

## Vanilla: the stock look. Bold: same motion, bigger outlined font. Festive: bold plus a pop and an arc. Choosing one overwrites the entries below; changing any of them flips this to Custom.
# Setting type: String
# Default value: Festive
# Acceptable values: Vanilla, Bold, Festive, Custom
Preset = Custom

## Numbers further than this from the camera are not shown. Vanilla: 30.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 100
MaxDistance = 30

## Do not show hits for 0 damage at all. Vanilla shows a grey 0.
# Setting type: Boolean
# Default value: false
HideZeros = false

## How many numbers can be on screen at once; the oldest is dropped beyond that. Vanilla has no cap (200 for zeros).
# Setting type: Int32
# Default value: 64
# Acceptable value range: From 8 to 400
MaxAlive = 64

## Extra lines in the BepInEx log.
# Setting type: Boolean
# Default value: false
Verbose = false

## Development aid: run console commands written to BepInEx/config/DamageSplash.cmd, one per line, then delete the file.
# Setting type: Boolean
# Default value: false
DevCommandFile = false

[2 Font]

## Font for the numbers. "Vanilla" keeps the game's own damage-text font. The list is filled with every TextMeshPro font the game has loaded once you are in a world; use `splash fonts` to refresh it.
# Setting type: String
# Default value: Vanilla
# Acceptable values: Vanilla, Valheim-AveriaSansLibre, Valheim-AveriaSerifLibre, Valheim-Norse, Valheim-Norsebold, Valheim-Prstartk, Valheim-Rune, EMPTY ASSET, Fallback-NotoSansNormal, Fallback-NotoSansThin, Fallback-NotoSerifNormal, LiberationSans SDF, LiberationSans SDF - Fallback, Norsebold SDF, NotoEmoji-Light SDF, NotoEmoji-Regular SDF, NotoSansArabic-Light SDF, NotoSansArabic-Regular SDF, NotoSansArmenian-ExtraLight SDF, NotoSansArmenian-Regular SDF, NotoSansBengali-ExtraLight SDF, NotoSansBengali-Regular SDF, NotoSansDevanagari-ExtraLight SDF, NotoSansDevanagari-Regular SDF, NotoSansGeorgian-ExtraLight SDF, NotoSansGeorgian-Regular SDF, NotoSansHebrew-Light SDF, NotoSansHebrew-Regular SDF, NotoSansJP-Regular SDF, NotoSansJP-Thin SDF, NotoSansKR-Regular SDF, NotoSansKR-Thin SDF, NotoSansMalayalam-ExtraLight SDF, NotoSansMalayalam-Regular SDF, NotoSansSC-Regular SDF, NotoSansSC-Thin SDF, NotoSansThai-ExtraLight SDF, NotoSansThai-Regular SDF, NotoSerifArmenian-Regular SDF, NotoSerifBengali-Regular SDF, NotoSerifDevanagari-Regular SDF, NotoSerifGeorgian-Regular SDF, NotoSerifJP-Regular SDF, NotoSerifKR-Regular SDF, NotoSerifMalayalam-Regular SDF, NotoSerifSC-Regular SDF, NotoSerifThai-Regular SDF
Font = Vanilla

## Apply TextMeshPro's bold style on top of the font. Useful when only a regular weight is loaded.
# Setting type: Boolean
# Default value: false
FauxBold = false

## Font size for hits at or closer than NearDistance. Vanilla: 16.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 4 to 96
NearSize = 30

## Font size for hits at or beyond FarDistance. Vanilla: 8.
# Setting type: Single
# Default value: 14
# Acceptable value range: From 2 to 96
FarSize = 14

## Metres. Size shrinks smoothly from NearSize at this distance to FarSize at FarDistance. Set both equal for vanilla's hard step at 10 m.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 100
NearDistance = 8

## Metres. See NearDistance.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 0 to 100
FarDistance = 30

## Fattens (positive) or thins (negative) the strokes. TextMeshPro's outline grows half inward, so pair an outline with some boldness or thin fonts go black. Vanilla: 0.
# Setting type: Single
# Default value: 0.28
# Acceptable value range: From -0,5 to 0,6
Boldness = 0.28

## Outline thickness, 0 to 1 in TextMeshPro units. 0 disables the outline. Keep it modest; see Boldness. Vanilla: 0.
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From 0 to 1
OutlineWidth = 0.18

## Outline colour.
# Setting type: Color
# Default value: 000000FF
OutlineColor = 000000FF

## Soft drop shadow behind the number. Vanilla: off.
# Setting type: Boolean
# Default value: true
Shadow = true

## Shadow offset, 0 to 1.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
ShadowOffset = 0.3

