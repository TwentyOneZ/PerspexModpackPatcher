## Settings file was created by plugin Bindrune v0.5.0
## Plugin GUID: isimp.Bindrune

[Display]

## Show keys as your keyboard labels them, so the key marked Y on a German keyboard reads Y rather than Z. Only the display changes; keys are stored and compared the same way either way. Takes effect when the panel is reopened.
# Setting type: Boolean
# Default value: true
KeyboardLayoutLabels = true

[General]

## Opens the Bindrune panel.
# Setting type: KeyboardShortcut
# Default value: Insert
OpenKey = Insert

[Hints]

## Shows or hides the on-screen key hints.
# Setting type: KeyboardShortcut
# Default value: H + LeftAlt
ToggleKey = H + LeftAlt

## Whether the on-screen hints are showing. Set by the toggle key; kept so they come back as you left them.
# Setting type: Boolean
# Default value: false
Visible = false

## Text size of the on-screen hints.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 9 to 32
FontSize = 15

## Where the hints sit across the screen: 0 is the left edge, 1 the right. Set by dragging them while the panel is open.
# Setting type: Single
# Default value: 0.02
# Acceptable value range: From 0 to 1
X = 0.02

## Where the hints sit up the screen: 0 is the bottom, 1 the top. Set by dragging them while the panel is open.
# Setting type: Single
# Default value: 0.06
# Acceptable value range: From 0 to 1
Y = 0.06

## Where the text sits inside the hint box.
# Setting type: HintAlign
# Default value: Left
# Acceptable values: Left, Center, Right
TextAlignment = Left

## Which way the list extends as hints are added: Up pins its bottom edge, Down pins its top.
# Setting type: HintGrowth
# Default value: Up
# Acceptable values: Up, Down
Growth = Up

## Whether each hint names the mod it comes from as well as the action.
# Setting type: Boolean
# Default value: false
ShowModNames = false

## Whether each hint leads with the key you press or with what it does.
# Setting type: HintOrder
# Default value: KeyFirst
# Acceptable values: KeyFirst, ActionFirst
Order = KeyFirst

[Panel]

## Panel width in pixels. Set by dragging the corner handle.
# Setting type: Single
# Default value: 1280
# Acceptable value range: From 900 to 3840
Width = 1280

## Panel height in pixels. Set by dragging the corner handle.
# Setting type: Single
# Default value: 820
# Acceptable value range: From 520 to 2160
Height = 820

## Mouse wheel distance per notch in the bind list. Takes effect next time the panel is opened.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 20 to 1200
ScrollSpeed = 300

