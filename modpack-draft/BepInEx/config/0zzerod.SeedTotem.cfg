[AdvancedSeedTotem]

## Default width for Auto Field.
# Setting type: Single
# Default value: 9
DefaultWidth = 9

## Default length for Auto Field.
# Setting type: Single
# Default value: 21
DefaultLength = 21

Recipe = FineWood:10,GreydwarfEye:10,SurtlingCore:2,AncientSeed:1

Location = Hammer

[Ashvine]

## Minimum distance from wall structure to allow ashvine planting.
# Setting type: Single
# Default value: 1
MinWallDistance = 1

## Maximum distance from wall structure to allow ashvine planting.
# Setting type: Single
# Default value: 4
MaxWallDistance = 4

## Comma-separated list of wall keywords to check proximity against for ashvine planting.
# Setting type: String
# Default value: woodwall,stonewall,pillar
WallTypes = woodwall,stonewall,pillar

## If true, allows VineberrySeeds to be planted in standard Seed Totems.
# Setting type: Boolean
# Default value: false
AllowVineberrySeeds = false

[Bushes]

## If true, allows (Berry) Bushes to be queued and planted.
# Setting type: Boolean
# Default value: true
AllowBushes = true

## Bush mappings from item name to pickable prefab name. Format: ItemName:PickablePrefab,ItemName2:PickablePrefab2
# Setting type: String
# Default value: Raspberry:RaspberryBush, Blueberries:BlueberryBush, Cloudberry:CloudberryBush
BushMappings = Raspberry:RaspberryBush, Blueberries:BlueberryBush, Cloudberry:CloudberryBush

## Grow space radius required for berry bushes.
# Setting type: Single
# Default value: 0.5
GrowRadius = 0.5

[Flowers]

## If true, allows Flowers to be queued and planted.
# Setting type: Boolean
# Default value: true
AllowFlowers = true

## Flower mappings from item name to pickable prefab name. Format: ItemName:PickablePrefab,ItemName2:PickablePrefab2
# Setting type: String
# Default value: Dandelion:Pickable_Dandelion, Thistle:Pickable_Thistle, Fiddleheadfern:Pickable_Fiddlehead
FlowerMappings = Dandelion:Pickable_Dandelion, Thistle:Pickable_Thistle, Fiddleheadfern:Pickable_Fiddlehead

## Grow space radius required for flowers.
# Setting type: Single
# Default value: 0.2
GrowRadius = 0.2

[Gameplay]

## Interval between seed dispersion.
# Setting type: Single
# Default value: 10
DispersionTime = 10

## Seeds to disperse per cycle.
# Setting type: Int32
# Default value: 3
DispersionCount = 3

## Max retries for placement.
# Setting type: Int32
# Default value: 10
MaxPlacementRetries = 10

## Max seeds in queue.
# Setting type: Int32
# Default value: 100
MaxSeeds = 100

## Require cultivated ground.
# Setting type: Boolean
# Default value: true
CheckCultivated = true

## Require correct biome.
# Setting type: Boolean
# Default value: true
CheckBiome = true

## Harvest pickables on hit.
# Setting type: Boolean
# Default value: true
HarvestOnHit = true

## Only admin can resize radius.
# Setting type: Boolean
# Default value: true
AdminOnlyRadiusControl = true

## Extra margin (in meters) for grow space and harvesting checks.
# Setting type: Single
# Default value: 0.5
Margin = 0.5

## If true, mobs will ignore Seed Totems.
# Setting type: Boolean
# Default value: true
MobsIgnoreTotems = true

