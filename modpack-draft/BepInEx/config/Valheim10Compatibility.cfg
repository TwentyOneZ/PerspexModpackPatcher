[Bridges]

## Inject the pre-1.0 List<List<Piece>> PieceTable.m_availablePieces beside 1.0's HashSet<Piece> field, sharing the per-category lists with m_availablePiecesByCategory. Restores 15 build-piece mods on the reference profile. Caveat: 1.0 inserted PieceCategory.DeepNorth = 5, so a pre-1.0 mod that bakes category numbers (Feasts=5, Food=6, Meads=7, custom tabs from old Max=8) files pieces one tab off. Turn off if build-menu tabs look wrong.
# Setting type: Boolean
# Default value: true
PieceTableAvailablePiecesAlias = true

## De-literalize ZRoutedRpc.Everybody from a const to a static field so legacy mods and ServerSync using ldsfld instructions do not throw MissingFieldException.
# Setting type: Boolean
# Default value: true
ZRoutedRpcEverybodyStatic = true

## Give the Hoverable.GetHoverOffset() interface method a default body (returns 0f) instead of leaving it abstract, so a pre-1.0 class implementing Hoverable without it still passes VTable setup. Off = pre-1.3.0 behaviour: every such class throws TypeLoadException the moment its assembly is scanned, taking every Harmony patch in that assembly down with it.
# Setting type: Boolean
# Default value: true
HoverableGetHoverOffsetDefault = true

[Harmony]

## Detour HarmonyX's AccessTools lookups so by-name [HarmonyPatch] targets ignore compatibility bridges and resolve vanilla-added overloads (Inventory.Load, PieceTable.SetCategory, Attack.GetAttackEitr, ...) to their pre-1.0 shape. Off = 1.1.x behaviour: every bridge beside a by-name patch is refused.
# Setting type: Boolean
# Default value: true
ResolutionHook = true

[Shields]

## Acted on by the Adapter plugin (BepInEx/plugins), declared here so this file documents it. Before ObjectDB.UpdateRegisters rebuilds its hash table, drop any later item prefab whose name hash duplicates an earlier one - the first registration wins, which is vanilla's whenever vanilla owns the name - and log which. Vanilla's Dictionary.Add would otherwise throw and abort FejdStartup.Start on client and server (server never loads a world, client menu spams NullReferenceException). Reached on 1.0 through a Jotunn ordering bug whenever a mod's custom item name collides with new 1.0 content (More Ore Deposits 1.3.5's GoldOre). The shield keeps the game up; the colliding mod still needs a 1.0 build. Off = startup aborts as on plain 1.0.
# Setting type: Boolean
# Default value: true
ObjectDBDuplicateItems = true

