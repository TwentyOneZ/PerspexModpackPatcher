## Settings file was created by plugin Recycle Items Into Parts v1.8.5
## Plugin GUID: cjayride.RecycleItemsIntoParts

[General]

## If true, clients must use the server/host recycle settings. If false, each player uses their own config.
# Setting type: Boolean
# Default value: true
ServerEnforced = true

## Keyboard key name (Unity KeyCode). Use Delete, not delete.
# Setting type: String
# Default value: Delete
RecycleHotkey = Delete

## Enable this mod
# Setting type: Boolean
# Default value: true
Enabled = true

## Return resources if recipe is unknown
# Setting type: Boolean
# Default value: true
ReturnUnknownResources = false

## Return resources for Epic Loot enchantments
# Setting type: Boolean
# Default value: true
ReturnEnchantedResources = false

## Fraction of craft materials to return (0.0 - 1.0). 0.25 means 1 bronze returns nothing, 4 bronze returns 1.
# Setting type: Single
# Default value: 0.25
ReturnResources = 0.1

## Enable/disable coins on recycling items
# Setting type: Boolean
# Default value: false
RecycleCoins = false

## Enable/disable recycling of consumables (like food) (need to disable for cjaycraft ultimate modpack)
# Setting type: Boolean
# Default value: true
RecycleConsumables = false

## Enable/disable recycling of Trophy items (need to disable for cjaycraft ultimate modpack)
# Setting type: Boolean
# Default value: true
RecycleTrophy = false

## Enable/disable recycling of Shards (need to disable for cjaycraft ultimate modpack)
# Setting type: Boolean
# Default value: true
RecycleShards = false

## Return EpicLoot enchant materials one rarity lower (Legendary -> Epic). Lowest Magic rarity returns none.
# Setting type: Boolean
# Default value: true
DowngradeEnchantRarity = true

## Show a Yes/No popup with returned parts before recycling.
# Setting type: Boolean
# Default value: true
RequireConfirm = true

